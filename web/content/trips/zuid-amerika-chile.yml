  - time: Day 18
    locationName: Futaleufú
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Onze nieuwe bestemming is een wildwater paradijs. Op de planning: Kajakken en opnieuw raften. Maar die plannen lopen al snel in het water. De dag na onze aankomst is het ijskoud en veel regen 💧💧 We proberen door de buitjes door een wandelingetje te maken en rijden naar enkele sightseeings.

      We korten onze tijd hier in en gaan de regendagen gebruiken om wat kilometers te maken richting het zuiden. 🚗
