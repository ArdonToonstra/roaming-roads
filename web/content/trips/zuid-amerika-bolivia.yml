itinerary:
  - time: 3 days - 3 nights
    locationName: La Paz
    description: "Start you trip in this  stunning, high-altitude Andean city known as the world's highest seat of government, famous for its dramatic setting in a canyon, vibrant indigenous culture (Aymara/Quechua), chaotic yet charming markets (like the Witches' Market), and innovative Mi Teleférico cable car system offering incredible views. "
    activities: |-
      - Arrange transport from the airpot to the city center. Check-in at your hotel and acclimatize, La Paz is a high attitude city . 
      - There is so much to do in this wonderful city: 
      - 
        - Go around the city with the cable car system. You can choose a destination or just go around an enjoy the views. Check [the map](https://www.miteleferico.bo/nuestras-lineas) and starting points. 
        - Visit the [Witchers market](https://maps.app.goo.gl/iyQJoUx9TF1kCeH97) and buy some souvenirs. 
        - Learn about the coca culture in the [Coca Museum](https://maps.app.goo.gl/2kzdCi99pybbKwt19). 
        - Eat at the amazing vegetarian restaurant: [Ali Pacha](https://maps.app.goo.gl/7Dj5zHu6R9kAgEZLA). 
        - Visit the colourfull neighborhoud of [Chualluma](https://maps.app.goo.gl/DxmAdVyGfR9633149). Read [this blog](https://thepartyingtraveler.com/2019/12/16/how-to-visit-the-colorful-neighborhood-of-chualluma-in-la-paz/) to prepare your visit. 
        - Make a hiking day trip to [the Palca Canyon](https://maps.app.goo.gl/RLbdsf7uTfSJwbSH6) (13km one direction). You can arrange a taxi to the starting point or take a shared mini van ([at this location](https://maps.app.goo.gl/y8hcDcwUTYabUsHy6)). There where no other tourist on the whole hike! You can follow the directions on [Wikiloc](https://nl.wikiloc.com/routes-wandelen/palca-valle-de-las-animas-canon-de-palca-23986041). 
        - Take a mountainbiking trip to the [death road](https://maps.app.goo.gl/9K8VqyEMpVJPKECTA)! 
      - If you are fit and well acclimatized, you can think about doing a multi-day trip to a top of a mountain in the Andes. We went to the Huayana Potosi!
