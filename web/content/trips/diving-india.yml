  - time: Days 1–7
    locationName: Swaraj Dweep (Havelock) — exploring the island
    description: "The island is small enough to explore entirely by scooter in a day, and a rented scooter is the easiest way to get around between dives. The road runs between the main villages, the jetty and the beaches, with side tracks leading to jungle trails and quieter stretches of sand."
    activities: |-
      - Rent a scooter for the week. Traffic is light, but watch out for potholes and cows on the road.
      - Hike through the jungle to Elephant Beach instead of taking the boat. The trail is muddy in places, so wear proper shoes.
      - Watch the sunset at Radhanagar Beach on the west coast, one of the best-known beaches in India.
      - Drive out to the smaller beaches on the east coast, where you often have the sand to yourself.
      - Eat your way through the island's restaurants. For its size, Swaraj Dweep has a remarkable spread of seafood, Indian and backpacker cafés.
