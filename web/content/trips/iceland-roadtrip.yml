  - locationName: Stuðlagil canyon
    description: A canyon of basalt columns.
    activities: |-
      A canyon lined with tall basalt columns along a blue-green glacier river. It only appeared after a hydropower dam upstream lowered the river.

      - The west side has an easy viewpoint with stairs.
      - The east side needs a longer walk but brings you down to the river among the columns, and it is worth the extra time.
    connectionType: side_trip
    location:
      - -15.4248871
      - 65.129296
