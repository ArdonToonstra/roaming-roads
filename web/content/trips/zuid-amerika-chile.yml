  - time: Day 21
    locationName: Chiloé
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na de wandeltocht boeken we een chille tiny house waar we terug van wat luxe kunnen genieten. We krijgen er een gezellige huiskat bij (zie laatste foto).

      De volgende dag zetten we onze tocht terug richting het noorden en laten Patagonië achter ons. We rijden stevig wat kilometers en komen na een lange ferry aan op Chiloé, het grootste eiland van Chili.

      Op Chiloé genieten we van het eilandleven vanop een rustige camping achter de duinen. We maken vanaf de camping een mooie kayak tocht en hebben eindelijk nog eens tijd voor een uitgebreide apero, diner en kampvuur 🔥

      De laatste dag maken we nog een korte wandeling door het nationale park (beenspiertjes blijven trainen) en gaan met een bootje de pinguinkolonies bezichtigen. We proberen ook enkele stadjes te bezoeken maar dat is niet echt een aanrader 🤪

      We zijn uit gerelaxt en al weer klaar om verder te reizen!
