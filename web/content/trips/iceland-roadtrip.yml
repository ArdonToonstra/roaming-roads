    blockType: waypoint
  - locationName: Skógafoss
    description: A 60 m curtain of water right next to the road.
    activities: |-
      One of the biggest waterfalls in Iceland. On sunny days a rainbow often hangs in the spray.

      - Climb the stairs beside the falls to the viewpoint at the top.
      - Follow the trail upstream for a series of smaller waterfalls. It is the start of the Fimmvörðuháls trek.
    connectionType: route
    location:
      - -19.4949498
      - 63.5495018
