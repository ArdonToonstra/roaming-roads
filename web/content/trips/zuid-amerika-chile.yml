  - time: Day 5
    locationName: "Día 3: Dickson - Los Perros (Torres del Paine)"
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Onze spieren geraken gewend terwijl her landschap aan het veranderen is. We lopen nu door bergen met gletsjers en ijskoude rivieren stromen voorbij. 🏞️

      Het kamp is primitief, ze verkopen niets en hebben enkel een koude douche in de aanbieding. We doen een wasje en een dutje aan het strand (lees riviertje naast de camping).

      Na het koken van onze zoveelste dehydrated meal en spelen we het Lama spel met enkele andere wandelaars en ontdekken al snel dat het doodsaai is (zelf maar nieuwe regels bedenken dan).

      Iedereen heeft het over morgen: de zwaarste etappe van de hele tocht. Spannend!
    location:
      - -73.131987767
      - -50.928202852
    gallery:
      - media: chile-step05-dia-3-dickson---los-perros-torres-del-paine-01.jpg
      - media: chile-step05-dia-3-dickson---los-perros-torres-del-paine-02.jpg
    blockType: fullDay
  - time: Day 6
    locationName: "Día 4: Los Perros - Grey (Torres del Paine)"
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Tientallen wekkers beginnen af te gaan vanaf 4u.. het is vandaag de zwaarste dag en het pad naar de pas wordt afgesloten om 7u. Iedereen loopt nerveus rond op de camping. Er wordt een sneeuwstorm voorspeld ❄️

      We beginnen aan onze klim over de John Gardner pas. Klinkt chique en dat was het ook. Onze voeten en knieëen moeten duur betalen om aan de overkant te geraken. Op de top worden we beloond met het uitzicht op de grootste gletsjer die we ooit zagen. In plaats van een sneeuwstorm krijgen we twee mooie regenbogen te zien. 🌈 We zijn ondertussen goed ingelopen en komen na 9u wandelen aan in het volgende kamp.

      In camping Grey komen de o-trek en de w-trek samen. Het is hier dan ook ineens druk en er is een echt restaurant! We ontmoeten andere Nederlanders die die dag begonnen zijn. Ze ruiken naar zeep en hebben nog verse groeten en fruit (jaloers 😋).
    location:
      - -73.183753125
      - -51.000289629
    gallery:
