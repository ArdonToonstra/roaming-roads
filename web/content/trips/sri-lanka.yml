  - time: 2 day - 1 night
    locationName: Hiriketiya Beach
    description: "A stunning, horseshoe-shaped bay on the south coast known for its golden sands, clear turquoise water, and lush jungle setting away from mass tourism. "
    activities: |-
      - Rent a surf board and a surf teacher! The waves are for beginners so perfect to start surfing here. 
      - Relax on the beach and rent one of the chairs to read a book. 
      - Walk to Blue Beach Island. 
      - Attend a yoga or cooking class. 
      - Watch the sunset from the beach.
