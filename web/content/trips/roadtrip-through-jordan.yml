  - time: Day 7
    locationName: Wadi Rum
    description: Jordan's stunning desert, aslo known as the "Valley of the Moon" for its otherworldly red sands, towering sandstone cliffs, natural arches, and vast canyons, offering a landscape reminiscent of Mars.
    activities: |-
      Park your car in Wadi Rum Town and your accomodation will arrange a pick-up to the camp in the desert. You can arrange different activities while in the camp. You can make a short hike, book a 4x4 trip through the best spots in the dessert, go camel riding, watch the sunset and do some stargazing at night. 

      There are a lot of different camps and options. Find one on booking you like and that has good reviews.
