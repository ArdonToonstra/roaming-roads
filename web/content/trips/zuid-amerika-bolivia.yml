  - Jungle trek 
  - Mine visit 
  - Colonial towns 
  - Mountainbiking
importantPreparations: |-
  - Buy your flights! Look for tickets to La Paz or Sucre. Both are perfect starting points for the travel. 
  - You will not need a travel permit to enter Bolivia. 
  - Install an eSim (only if you have eSim available on your phone). 
  - Book a hotel for your first nights. 
  - Bring cloths for hot and cold weather. Bolivia has jungle and high mountains. Temperatures can vary a lot. 
  - Most of the transports in Bolivia are with night buses. You sleep in the bus arrive very early in the morning. Most hotels are used to this and allow a very early check-in after the travel.
