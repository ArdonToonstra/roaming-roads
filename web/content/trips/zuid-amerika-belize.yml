  - time: Day 1
    locationName: Caye Caulker
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na een bus, grensovergang en ferry komen we aan op een mini eilandje in Belize: Caye Caulker. We werden al gewaarschuwd dat het hier duur zou zijn dus boeken we een studio met eigen keukentje.

      Het moto van het eiland is ‘go slow’, maar dat kan niet anders met deze extreme hitte. We beslissen om niks te plannen en te kijken wat onze dagen hier brengen. Nadat we het goede nieuws krijgen dat ons neefje (en petekindje van Lisa) geboren is, beslissen we om heel de dag in een coole waterbar te gaan vieren! 👶🏻🍻

      Tijdens het verkennen van de rest van het eiland te voet zien we zeepaardjes, een tarpon feeding dock, leuke barretjes, een groooote stingray,..

      Na twee nachten vertrekken we alweer naar het volgende eiland!
