  - time: Day 12
    locationName: Conguillío National Park
    description: "A lava desert centred on the Llaima volcano, with thousand-year-old ash layers exposed along the trails. Pumas live here, though they are rarely seen."
    activities: |-
      - Drive into the park. The internal roads are rough and a 4x4 helps.
      - Climb Sierra Nevada for the best views over the volcano.
      - Camp inside the park. Bring a thick mat, since the lava rock punctures thin ones.
