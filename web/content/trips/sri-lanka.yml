  - time: 3 days - 2 nights
    locationName: Mirissa
    description: "A popular beach and nightlife destination! "
    activities: |-
      Avoid Mirissa if you like the lesser touristic spots. Choose for another beach destination (as Hiriketiya Beach). 

      What you can do in Mirissa: 

      - Rent a surf board and a surf teacher! The waves are for beginners so perfect to start surfing here. 
      - Relax on the beach and rent one of the chairs to read a book. 
      - Watch the sunset from the beach. 
      - Go whale and dolphin watching (if its the season) 
      - Take pictures at the popular [Coconut Tree Hill](https://maps.app.goo.gl/Qk8r93MXyJxM1aDDA) spot. 
      - Walk to Parrot Rock. 
      - Go snorkling with seaturtles.
