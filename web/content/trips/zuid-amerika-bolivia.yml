  - time: 2 days - 1 night
    locationName: Maragua Crater
    description: "Maragua Crater is a stunning geological wonder featuring colorful rock layers, dinosaur footprints,and waterfalls, serving as home to the indigenous Jalqa community. It is a cool and lesser known trekking destination blending natural beauty with cultural immersion. "
    activities: |-
      If you like hiking and have a little bit more time.. the Maragua Crater hike is pretty cool! 

      We had a hard time figuring out the transport to the starting point, the trails, where to sleep and how to get back to Sucre. That's why we documented everything on Wikiloc. Follow our instructions there!

      - [Day 1](https://loc.wiki/t/166901926?wa=sc)
      - [Day 2](https://loc.wiki/t/167019235?wa=sc)

      Enjoy!
