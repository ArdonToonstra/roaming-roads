  - time: Day 4
    locationName: "Día 2: Serón - Dickson (Torres del Paine) "
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Op onze tweede dag wandelen we 18km verder de vallei door en zien stilaan de bergen in de verte. We proberen veel te eten zodat onze rugzak snel lichter wordt.

      Op de volgende camping is een gezellig barretje waar we 3 leuke Chilenen leren kennen (die Engels spreken) en leren over het land, de geschiedenis, de cultuur, het eten, tips voor andere hikes in Chili,..

      Vermoeid vallen we weer vroeeeg in slaap 😴
    location:
