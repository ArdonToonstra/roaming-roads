  - time: 3/4 days
    locationName: Karakol Nature Park & Ala-kul Lake
    description: Multi-day trek leading to the stunning turquoise Ala-Kul Lake at 3,560 meters.
    activities: |-
      From the Karakol Yurt Village you can start the 3 day Ala-Kul trekking. 

      Starting the trek:

      - There are options to shorten the walking trip on the first day, using a military van. This is very expensive (around €90/9000 soms per persons) and only cut 14km of the trail. 
      - We drove as far as possible and started the hike from there. There is a lot of confusing information about where you can park: at the first, second or last bridge. Just don't go any further than [this point](https://maps.app.goo.gl/LbU3HjtyuTfRiFSS7). There will be some other cars on the side of the road where you can put yours. 

      Finishing the trek:

      - If you want to do the full tour (to Altyn Arashan), you will also need to arrange transport back to you car. You first have to walk all the way from Altyn Arashan back to the main road and arrange a taxi from there. This will cost you an extra day of hiking.
      - To make it more easy, we did the trip to Ala-Kul and back to the same starting point. We did this in two days. 

      Sleeping on the trail: 

      On the trail you can choose to sleep in de Yurt camps or to do wild camping. For wild camping check the marked options on MapsMe. It is not easy to camp on any other spot since the area is not flat and very rocky. 

      Navigation: 

      The walking trails itself, is easy to find on all walking apps (we use Wikiloc).
