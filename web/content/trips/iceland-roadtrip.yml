    blockType: waypoint
  - time: Day 4
    locationName: Kirkjubæjarklaustur
    description: "A small village between the lava fields and the black sands of the south coast, and the last proper stop before the long, empty stretch to Skaftafell. It makes a good base for the glacier hike the next day."
    activities: |-
      - Walk through Fjaðrárgljúfur, a winding moss-green canyon just west of the village.
      - Look at Kirkjugólf, a natural floor of basalt columns that looks man-made.
      - Fill up the tank and buy food here.
    location:
