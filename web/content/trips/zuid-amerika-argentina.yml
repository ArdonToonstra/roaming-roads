  - time: Day 1
    locationName: Tigre
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na een verrassingsbezoekje in de luchthaven van Lisa haar twee oudste zussen en petekindje nemen we afscheid. Na de 18 uur durende vlucht is onze nieuwjaarkater eindelijk verdwenen en lopen we Argentinë soepel binnen. We kiezen de stad van de tijger ‘Tigre’ om te bekomen van onze laatste drukke weken in België en te acclimatiseren. Tigre, het noordelijkste deel van Buenos Aires ligt tegen de Delta aan. Door al het water en natuur is dit een trekpleister voor locals uit de stad. De hele Delta is volbebouwd met huisjes en er is zeer veel bootverkeer om iedereen naar de juiste plek te krijgen. Stel je voor: een kruising tussen Giethoorn en een kilometers groot vakantiepark. We wandelen veel rond, bestellen onze eerste ‘dos cervezas por favor’ en nemen de taxiboot naar een gezellig plekje hoger in de Delta met restaurantjes en kayakers!

      Onze eerste observaties hier:

      ✅ We kunnen echt geen Spaans - en dat is een probleem. Gelukkig is iedereen super behulpzaam en vriendelijk.

      ✅ Een peso vandaag kan morgen de helft waard zijn (inflatie van 140% afgelopen jaar).

      ✅ Het hoogste bedrag in cash is ter waarde van €1. Dit resulteert in een serieus pak flappen bij onze eerste ophaling (zie foto).

      ✅ De Argentijnen kennen geen verfijnde keuken (een ei is een ei en een vegetarische salade is een bord met droge sla..). Maar ze weten gelukkig wel hoe ze echt Italiaans ijs moeten maken!

      ✅ Waarom zou je een website maken als whatsapp bestaat? Letterlijk alle business verloopt via chat: hotel boeken, auto huren, activiteiten boeken,.. Iedereen is 24/7 bereikbaar.

      ✅ 4 uur tijdverschil is zo overwonnen!

      Op naar de Pampas!
