    description: Coastal cliffs on the way to Öxarfjörður.
    activities: |-
      The road north of Húsavík follows the Tjörnes peninsula, with cliffs dropping into the sea and views over Öxarfjörður bay. There are several pull-outs along the way.
    connectionType: route
