  - time: Day 5
    locationName: Buenos Aires (2/2)
    description: "The second half of a Buenos Aires stay is where the city's own rhythms surface: grill houses, long park afternoons, the painted docks of La Boca, Malbec, and the milongas where tango is danced rather than performed. Tango began as a dance between rival immigrant communities, and the neighbourhood halls still feel closer to that than the dinner shows do."
    activities: |-
      - Eat at a neighbourhood parrilla (grill house) — the default social setting for any group meal.
      - Walk the Bosques de Palermo, the largest city park in the country and a genuine full afternoon.
      - Visit La Boca, the birthplace of tango and the most colourful, most artistic quarter of the city.
      - Taste Argentine wines, then head to a milonga such as La Catedral: beginner classes early in the evening, open dancing until late.
      - Carry on to the city's electronic clubs afterwards — nightlife here does not really start before 2am.
      - Spend a Sunday at the San Telmo market: fourteen blocks of stalls plus an indoor food hall.
      - Watch a game of paleta frontón or padel, the local racquet sports, at a neighbourhood club.
    location:
