  - time: 3 days - 3 nights
    locationName: Sucre
    description: Bolivia's constitutional capital, known as the "White City" for its stunning, well-preserved Spanish colonial architecture, a UNESCO World Heritage site featuring white-washed buildings, churches and plazas.
    activities: |-
      Sucre, the main capital of Bolivia, is the city for Spanish classes and learn about the dinosaurs! 

      - If you have a lot of time, it is very cool to practice your Spanish. We had the best time in the [El Camino Spanish School](https://maps.app.goo.gl/Mb6fWU5szJQ5oYDGA) (at least one week). The school also arrange homestays with families where you can continue to practice your Spanish. The school arranges a lot of cultural activities as football games, salsa dancing,.. 
      - Visit the [Mercado Central](https://maps.app.goo.gl/7xbM3vXLsD5GA3Tb7) for shopping. 
      - Book a city tour with guide from [Greentrekkers](https://maps.app.goo.gl/quUiWoe62gK1neB16) and play the local Sapo Game. 
      - Visit the [Parque Simon Bolivar](https://maps.app.goo.gl/jwqk3adsE4Cj2Lo56). 
      - Book a cultural night out with diner and performances at the [Espacio Cultural Origenes](https://maps.app.goo.gl/CRpRUH8EHvbh6pyq7). 
      - Visit the [Parque Cretacico](https://maps.app.goo.gl/cUdxPRzbPic6A5yr7) (if you like dinosaurs). 
      - Go to the very traditional and local Tarabuco market (2 hours from Sucre - only on sunday). Take a taxi of take a shared bus at [this location](https://maps.app.goo.gl/peuwdXxJiUs7cgL96). 
      - See the best sunset at [the Monestary](https://maps.app.goo.gl/uC6R7eGbJj2XxbxG9) and have a drink at [Café Time & Coffee](https://maps.app.goo.gl/uPeP4QfQgUrqYLcB6).
