  - time: Day 2
    locationName: Laguna del Caminante
    description: "The standard introduction to multi-day trekking around Ushuaia: two days into the Sierra Valdivieso to a lake camp, crossing a high pass on the way back. Distances are short, but the weather turns by the hour — sun, rain, wind and a snowstorm in a single crossing is an ordinary day. \"Que te sea leve\", roughly \"may it be light on you\", is what locals say to anyone setting off."
    activities: |-
      - Pack for one night only; the route is short enough to walk with two daypacks instead of full packs.
      - Camp at Laguna del Caminante, a mountain lake ringed by peaks and one of the finest pitches in the area.
      - Cross the pass on the second day. Markers are minimal and easily lost in snow or fog, so carry a GPS track.
      - Look for the glacier cave just off the route near the pass; it is simple to walk straight past in bad visibility.
      - Finish in Ushuaia and take a night or two indoors before the long bus south-west into Chile.
