title: Diving the Belize Barrier Reef
status: draft
category:
  - backpacking
  - diving
coverImage: belize-step01-caye-caulker-01.jpg
description: "Two islands off the Belizean coast and a week on the second largest barrier reef in the world. Reef and nurse sharks in numbers, coral canyons and swim-through tunnels, paired with some of the highest prices in Central America."
period: June 2024
budget:
  currency: EUR
  perPerson: true
activities: |-
  Diving

  Snorkelling

  Island life

  Beach bars
