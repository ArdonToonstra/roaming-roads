  - time: 4 days - 3 nights
    locationName: Ometepe Island
    description: Formed by two massive volcanic peaks rising from Lake Nicaragua, Ometepe is a freshwater island defined by its fertile landscape and "slow travel" atmosphere. The island is largely navigated by scooter, passing through dense mango groves and small villages. It has become a center for permaculture, organic farming, and volcanic hiking, offering a distinct hippie-influenced vibe compared to the mainland.
    activities: |-
      - Rent scooters to navigate the island's circuit, which is the primary mode of transport.
      - Practice morning yoga at the local chocolate factory.
      - Hike the volcanic slopes to reach the San Ramon waterfall.
      - Explore the lake's coastline via kayak or visit freshwater swimming holes.
      - Tour permaculture farms and specialized mushroom laboratories to learn about sustainable cultivation.
      - Sample seasonal fruit from the island’s abundant mango trees.
      - Visit the main villages for local cuisine and healthy food options.

      Reaching the island requires coordinating multiple transport modes, including shuttles, local "chicken" buses, and the ferry from San Jorge. Ensure that all scooter rental documents and licenses are in order, as police checkpoints are frequent on the main roads.
