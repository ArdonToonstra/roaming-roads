  - time: Day 6
    locationName: Petra
    description: "Visit Petra, an ancient city, famous as a UNESCO World Heritage site. It's popular for its stunning rock-cut architecture, particularly the iconic Treasury (Al-Khazneh) and Monastery (Ad Deir), carved directly into rose-red sandstone cliffs. "
    activities: |-
      If you booked a Jordan Pass, your entrance is already included. Otherwise, you will have to buy a ticket. 

      You can choose how many days to visit. We decided to visit only one day, since we also visited the lesser known town of Little Petra (see last step). Start as early as possible and don't stay at the main attractions. We did a walking trip of around 20km through the town.  You can find the maps [here](https://www.visitpetra.jo/en/page/62/Main%20Trail). This is a long and though hike so bring enough water and good hiking shoes! 

      Stay the night is Wadi Musa town.
