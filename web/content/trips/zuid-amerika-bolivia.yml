description: |-
  Experience the different vibes of Bolivia: from the vibrant chaos of La Paz', jaw-dropping mountains, hikes on ancient Inca trails to the rich indigenous culture and cuisine. 
  It's raw, adventurous, and utterly unforgettable. 
period: April 2024
