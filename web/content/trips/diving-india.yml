importantPreparations: |-
  - Go in the dry season, roughly November to April. From May the monsoon makes ferries and dive trips unpredictable.
  - Flights from Delhi, Chennai and Kolkata land at Sri Vijaya Puram (Port Blair), the only real gateway.
  - Book the private catamarans to Swaraj Dweep ahead, as they sell out in high season. Fix your ferry before your flight back.
  - Permit rules for foreign visitors have changed several times, so check them before you book. The Nicobar Islands are closed to tourists.
  - ATMs on Swaraj Dweep are few and mobile data is patchy. Bring cash from Port Blair and download offline maps.
  - Dive from Swaraj Dweep itself, where the good sites are right off the island. Leave 24 hours between your last dive and the flight out.
itinerary:
  - time: Days 1–7
    locationName: Swaraj Dweep (Havelock) — diving
    description: "After the chaos of Delhi, Swaraj Dweep feels like stepping into a different country: warm air, palm-lined roads and a slow island pace. The island was renamed from Havelock in 2018, but both names are in everyday use. It is the diving hub of the Andamans, with a cluster of dive centres along the east coast and reefs, walls and pinnacles a short boat ride away."
    activities: |-
      - Plan around a week on the island, with time for eight or so dives spread over several days.
      - Expect healthy coral, big schools of reef fish, turtles and the occasional reef shark.
      - Ask your dive centre about the deeper sites further out for more experienced divers. Conditions decide the plan, so stay flexible.
      - Mix dive days with lazy days: nitrogen, sun and heat add up quickly.
