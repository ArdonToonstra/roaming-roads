    locationName: Popoyo
    description: Popoyo is a premier destination on Nicaragua’s Emerald Coast, globally recognized for its consistent surf and offshore winds.
    activities: |-
      - Surf the breaks that cater to all skill levels, from the forgiving Main Break to the challenging Outer Reef.
      - Access the region as a final beach chilling due to its relatively close proximity to the international airport in Managua.
