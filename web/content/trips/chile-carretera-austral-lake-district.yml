  - time: Day 11
    locationName: Pucón
    description: "The adventure capital of the Lake District, under the Villarrica volcano. Glaciers give way to cone volcanoes and a noticeably warmer climate. Arriving just after the Chilean holiday season means low prices and empty campsites."
    activities: |-
      - Camp by the river. Shop around, since the sites vary a lot in quality.
      - Go canyoning through the lahars, the lava channels cut by the volcano.
      - Soak in a tinaja fed by the volcano's natural hot springs.
      - Climb a volcano. Villarrica itself requires an expensive guided tour and is closed at the summit, so the second highest cone nearby is the better DIY option.
      - Pick blackberries and run your own parrilla. Vegetarian versions work fine.
    location:
