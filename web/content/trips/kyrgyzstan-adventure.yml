  - time: 1 day - 1 night
    locationName: Kol-Tor
    description: "Off the beaten track hike and camping. "
    activities: |-
      Drive from Kel-Suu back to Naryn and sleep somewhere on the road or in Naryn. The next day, drive to this (almost) secret lake. 

      The road is not mentioned on Google Maps and only locals seems to know this place. Only try to find this if you have a 4x4. 

      Directions: 

      - Take the turn at [this point](https://maps.app.goo.gl/WZcX1T1nCxzfpJG6A?g_st=com.google.maps.preview.copy) in Bosogo and keep driving. 
      - At some point you will see a small sign on your right side, pointing to your left. Follow the trail all the way to the river and keep on following and following. 
      - After a while you will see a Yurt Camp and keep on driving untill you see a big P sign (see picture, you cannot miss it!). Here you can park you car and start the trail. 
      - It is only 4,5km return. Take you picknick and swimming stuff and enjoy your time! 
      - It is also possible to camp at the lake or at any other place along the driving trail. We camped somewhere [here](https://maps.app.goo.gl/iHe5EjtiqMUQJf269) next to the river. 

      Find the information, directions and hiking map on [WikiLoc](https://nl.wikiloc.com/routes-wandelen/kol-tor-219013064?utm_medium=app&utm_campaign=share&utm_source=14331771).
