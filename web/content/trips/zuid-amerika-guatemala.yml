  - time: Day 7
    locationName: Tikal National Park
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Tijd voor een shotje geschiedenis & cultuur. 🛕We boeken 2 nachten in Flores om van daar de Maya ruïnes en tempels te bezoeken in Tikal. Flores is een leuk mini eilandje op een groot meer.

      We vertrekken ‘s ochtends met een grappige Engels sprekende gids die meer bezig is met ons te vermaken dan een duidelijk verhaal over de Maya’s te vertellen. Hij heeft wel oog voor de jungle dus we zien van alles onderweg zoals: toekans, aapjes en verschillende tarantula’s.

      Er waren amper mensen in Tikal en hadden de oude verloren mega stad dus bijna volledig voor onszelf!

      ‘S avonds moeten we nog wat quetzales opmaken (want morgen gaan we naar Belize!). We drinken nog wat biertjes met zonsondergang en komen nog andere mensen van onze tour tegen. Gezellig 🍻
