    locationName: San Juan La Laguna
    description: "The weaving village on Lake Atitlán, known for natural dyes and women's cooperatives. Small, bright and covered in murals."
    activities: |-
      - Book a weaving workshop. A scarf takes around four hours on a backstrap loom.
      - Buy textiles directly from the cooperatives rather than the tourist shops.
      - Walk the murals and the main street. One night is enough here.
