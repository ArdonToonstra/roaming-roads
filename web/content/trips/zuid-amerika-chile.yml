  - time: Day 10
    locationName: "Día 8: Las Torres! (del Paine) "
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      We moeten vandaag de laatste en meest bekende etappe van het circuit afleggen: de klim naar de ‘towers’. 🏔️ Onze bus vertrekt om 14u, dat wil zeggen dat we om 4u30 in de pikdonker starten (zonder rugzakken gelukkig). We hebben duidelijk al 7 dagen wandelen in de benen want we lopen de berg op alsof het niks is! We hebben de towers helemaal voor onszelf (vanaf 12u staan hier 100’en mensen)!

      De afdaling wandelen we samen met onze vrienden en sluiten het circuit samen af met cervezas 🫶
