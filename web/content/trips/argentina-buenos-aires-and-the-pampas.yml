coverImage: argentina-step01-tigre-01.jpg
description: "A soft landing in Argentina: the waterways of the Paraná Delta at Tigre, two quiet country towns out in the Pampas, and eight days in Buenos Aires itself — Spanish classes, parrillas, milongas and one of the greenest capital cities in South America. Built as the opening leg of a longer South American route."
period: January 2024
budget:
  currency: EUR
  perPerson: true
activities: |-
  City walking

  Spanish language school

  Tango and milongas

  Delta boat trips

  Markets and museums

  Wine tasting
added: "2025-12-26"
countries:
  - argentina
importantPreparations: |-
  - **Learn some Spanish first.** Outside tourist venues almost nobody speaks English. People are extremely helpful, but a week of classes at the start of the trip pays for itself.
  - **Cash and inflation.** Inflation ran at around 140% in 2023, so peso prices move fast and quoted prices go stale quickly. The largest banknote is worth roughly one euro, so a single ATM withdrawal comes out as a brick of notes — bring something to carry it in.
  - **Everything runs on WhatsApp.** Hotels, car rentals, tours and restaurants are usually booked by chat rather than through a website. Get a local SIM or eSIM early.
  - **City buses** cost a few euro cents but need a SUBE card, sold at kiosks and metro stations. Working out which line to take takes a day or two; after that the network is excellent.
  - **Food.** Cooking is simple and meat-centred, and vegetarian options outside the capital can be bare. Nothing is spicy, whatever the waiter warns you about. The Italian-style ice cream is exceptional.
  - **Mate** is shared from a single cup passed around the group, and drinking it is a conversation ritual as much as a drink. Accept when it is offered.
itinerary:
  - time: Day 1
    locationName: Tigre
    description: "Tigre sits at the northern edge of Buenos Aires, where the Paraná Delta breaks into hundreds of channels lined with stilt houses. Almost everything here moves by boat, and the whole delta is a weekend escape for city residents — somewhere between a canal village and a holiday park spread over several kilometres of water. The slow pace makes it a good first stop for shaking off a long-haul flight and the four-hour time difference."
    activities: |-
      - Walk the riverfront and the delta-side streets of the town itself.
      - Take a taxi boat further up the delta to the quieter channels, where riverside restaurants and kayak rentals cluster.
      - Watch the boat traffic that serves the delta's houses — for most of them it is the only way in or out.
      - Use the first evening to sort out cash, a local SIM and onward tickets before heading inland.
    location:
