  - time: Day 22
    locationName: Pucón
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Next up: het “Lake District” met Pucón als uitvalsbasis. We ruilen de glaciers in voor kegel vulkanen en krijgen er flink wat celcius bij.

      We komen 1 dag na het hoofdseizoen van de Chilenen aan. Wat normaal een heel toeristisch stadje is, is nu rustig en gezellig. We merken al snel dat hier zooo veel te doen is en spenderen de eerste dag met een planning maken. We rijden ook 4 campings af om uiteindelijk ons perfecte plekje te vinden aan de rivier 🏞️ De Chilenen die hier verblijven hebben hun BBQ van ‘s ochtends vroeg tot ‘s avonds aanstaan. We nemen hun goede voorbeeld over en na een actieve (en koude) ochtend canyoning door lahars (lavakloven) beginnen we aan onze veggie Parilla. Met succes!

      Dit is de perfecte plek en temperatuur voor een rustdag en die lassen we dan ook in! Overdag plukken we bergen met bramen en ‘s avonds genieten we vanuit een Tinaja van de natuurlijke warmwaterbron van de Villarica vulkaan.

      Om toch fit te blijven beslissen we om een van de vulkanen effectief te beklimmen. De hoogste, Villarica, is enkel de bereiken met een dure tour en wegens het lavameer mag je niet tot de top. Wij doen het dus weer eens op onze eigen manier.. we vinden op internet een wandenpad dat naar de top van de tweede hoogste vulkaan gaat. We moeten er wel wat dirty roads voor afrijden om uiteindelijk bij een boerderijtje te komen waar we voor een paar euro de auto mogen parkeren en via hun tuin naar boven kunnen lopen. Heel de dag niemand gezien en prachtige uitzichten! Goeie beslissing dus 🌋

      We verlengen onze auto een paar daagjes zodat we nog meer van deze omgeving kunnen verkennen!
