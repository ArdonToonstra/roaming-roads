description: "Exploration of Nicaragua’s unique geography, from the volcanic Maribios chain to the turquoise waters of the Caribbean. This route covers the country’s diverse offerings: world-class surfing in Popoyo and Playa Madras, the nightlife of the colonial cities, and the remote diving ecosystems of the Corn Islands."
