  - locationName: Vatnajökull glacier hike
    description: Crampons on Iceland's largest ice cap.
    activities: |-
      Vatnajökull covers about 8% of Iceland. Guided hikes on its outlet glaciers, mostly from Skaftafell, take you across ice ridges, crevasses and meltwater channels.

      - Only walk on the ice with a certified guide. Crampons, a harness and an ice axe are included.
      - Book in advance and wear waterproof hiking boots.
    connectionType: route
    location:
      - -17.2282428
      - 64.2419555
    gallery:
      - media: iceland-vatnajokull-03.jpg
      - media: iceland-vatnajokull-06.jpg
      - media: iceland-vatnajokull-14.jpg
    blockType: waypoint
  - locationName: Jökulsárlón & Diamond Beach
    description: Icebergs on black sand.
    activities: |-
      Icebergs break off the glacier into the Jökulsárlón lagoon and drift out to sea. Pieces of ice then wash back onto the black-sand beach across the road, which is why it is called Diamond Beach.

      - Stop at the lagoon first. Seals often swim near the outlet.
      - From here the drive to the east fjords is long. Allow 4–5 hours to Seyðisfjörður.
    connectionType: route
    location:
      - -16.1784043
      - 64.0506408
    gallery:
