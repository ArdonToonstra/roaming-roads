  - time: 2 days - 1 nights
    locationName: Big Corn Island
    description: Big Corn Island serves as the more spacious counterpart to its smaller neighbor, offering a paved road network and a distinct Caribbean atmosphere. The island is characterized by its relaxed pace, reggae influences, and a local feel with fewer tourist crowds. It provides a blend of traditional Nicaraguan culture and island scenery, making it an ideal location for exploration by scooter.
    activities: |-
      - Transfer from Little Corn Island via the early morning panga boat to maximize daylight hours.
      - Hire a scooter and discover secluded coastal spots.
      - Sample a traditional Nicaraguan breakfast featuring gallo pinto (rice and beans), eggs, and fried plantains.
      - Visit the island’s expansive white-sand beaches for swimming in turquoise waters.
      - Take a boat shuttle to the offshore floating bar for sunset drinks.
