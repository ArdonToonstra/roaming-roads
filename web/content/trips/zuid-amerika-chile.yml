  - time: Day 17
    locationName: Chaitén Vulcan
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Tijdens de 6 uur durende ferry naar Chaiten zien we plots allemaal zeeleeuwen!! 🦭 Ze liggen lekker te chillen in de zon, heel cool!

      Bij aankomst settelen we ons op een mooie camping met uitzicht over een meertje. Er is zowel ‘ avonds als ‘s ochtends niemand te bespeuren.. en ook geen bereik om de eigenaars te contacteren. Gratis overnachting dan maar!

      Voor we onze roadtrip verder zetten, beklimmen we de smeulende Chaiten vulkaan in het Pumalin Douglas Tompskin park (gedoneerd park aan Chile door founder van North Face). We hebben prachtig uitzicht over de wolkige omgeving en zien de actieve vulkaan hier en daar smeulen 🌋

      Op de vulkanische grond groeien allemaal roze bloemetjes, waar kolibries verzot op lijken. De vulkaan is een Walhalla voor deze kleine vogeltjes 🤩

      We nemen de ene na de andere lifter mee richting Futaleufu. Blijkbaar is dit een hele hippe liftbestemming voor jonge Chilenen uit Santiago.
    location:
