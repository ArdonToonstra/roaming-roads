description: "A loop through highland Guatemala. Colonial Antigua, a week around Lake Atitlán with weaving villages and a yoga retreat, an overnight climb on Acatenango facing the erupting Fuego, the limestone pools of Semuc Champey and the Maya city of Tikal."
period: May – June 2024
