  - time: Day 4
    locationName: Buenos Aires (1/2)
    description: "Buenos Aires is enormous and rewards a long stay — eight days is a sensible minimum and still feels short. A good way to structure the first half: enrol in a week of group Spanish classes in the morning and use the afternoons to work through the neighbourhoods one at a time."
    activities: |-
      - Take a week of group Spanish lessons. Several schools in the centre run rolling weekly courses, and the classes are a fast way to meet other travellers.
      - Rent an apartment rather than a hotel; short-term duplexes and studios are plentiful and cheap by European standards.
      - Visit Recoleta cemetery with a guide — an extraordinary city of mausoleums, and far more interesting with the stories attached.
      - Walk the botanical garden and the Japanese garden in Palermo.
      - Shop in Palermo, the city's design and boutique district.
      - Book a tango show with dinner and hotel pick-up. Unashamedly touristy, and worth doing once.
      - Eat at the upmarket vegan restaurants in Palermo and the centre — Buenos Aires has one of the best plant-based scenes in South America.
    location:
