      Bolivia makes wine? Yes they do! 

      Tarija is a bit of the beaten track destinations. Not so much tourist come here, except Bolivians, which makes it even more special. 

      - Take a wine tour to different wine producers. 
      - Rent a bike and bike around Tarija. 
      - Visit and hike in the [Coimata Nature Reserve](https://maps.app.goo.gl/TjunurQjoUjPuaSEA). 
      - ...
