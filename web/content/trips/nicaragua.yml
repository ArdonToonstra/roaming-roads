  - time: 2 days - 1 night
    locationName: León / Las Peñitas
    description: León serves as Nicaragua’s intellectual and political heart, characterized by its colonial history and landmark architecture. Just a short drive from the city center lies Las Peñitas, a tranquil fishing village and beach destination on the Pacific coast. This pairing allows for a quick cultural exploration of the city’s historic sites before retreating to the ocean to escape the inland heat.
    activities: |-
      - Climb the roof of the León Cathedral, the largest in Central America, for views of the surrounding volcanic chain.
      - Take a walking tour through the city center to see the colonial plazas and local murals.
      - Drive to the coast at Las Peñitas for beach walks along the volcanic sand.
      - View the Pacific sunset from the various beachfront cafes and bars.
    location:
