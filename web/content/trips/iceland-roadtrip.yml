  - locationName: Kolugljúfur canyon
    description: A hidden canyon on the long drive back.
    activities: |-
      A narrow gorge in Víðidalur, where the Kolufossar waterfalls drop into the canyon. Few people stop here, and it is a good break on the long drive from the north to Reykjavík. It is named after a troll woman from local legend.

      - It is a short detour from the Ring Road on a gravel road.
    connectionType: route
    location:
