  - time: Day 5
    locationName: "Buenos Aires (2/2) "
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Deel 2 van ons Buenos Aires avontuur!

      ✅ Gezellig uiteten in een lokale Parrilla (bbq huis) met de Spaanse school. We kijken naar een wedstrijd van een voor ons nieuwe sport (soort squash met 4).

      ✅ We trainen onze wandelspieren en maken een enorme wandeling door het grootste stadspark dat we ooit gezien hebben.

      ✅ We reizen naar de geboorteplek van Tango: Las Bocas, ook wel het meest kunstzinnige en gekleurde deel van Buenos Airs.

      ✅ We proeven verschillende Argentijnse wijnen waarna we naar een typische ‘Milonga’ trekken: La Cathedral. Met wat hulp van een oude Amerikaanse gepensioneerde professor zetten we onze eerste Tango danspassen op de dansvloer. Later die nacht zetten we nog een paar andere danspassen in een technoclub genaamd Underclub.

      ✅ Last but not least, een 14 blok grote zondagsmarkt met een gezellige binnen foodhal.

      Nog enkele leuke weetjes:

      1️⃣ Honden zijn een nog favorieter huisdier dan bij ons (lees veel kak op straat)

      2️⃣ Buenos Aires is een van de groenste steden die we kennen

      3️⃣ De bus kost 0,05 eurocent maar je hebt wel wat tijd nodig om erachter te komen welke bus te nemen. Eenmaal gewend werkt het uitstekend!

      4️⃣ Mate drink je zoals de indiginous mensen deden. Een chief geeft de bittere koffie/thee drank door. Als je drinkt, praat je over je leven en gevoelens.

      5️⃣ Tango is ontstaan als gevechtsdans tussen immigranten.

      6️⃣ De smaak pikant is hier onbekend. Zelfs na een waarschuwing van de ober ‘very spicy’ proeven we niks!

      Eind conclusie: Buenos Aires is een echte aanrader! Een gigantische maar leefbare stad, waar altijd iets te doen is.
