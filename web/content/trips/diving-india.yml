description: "A week of tropical island time in the Bay of Bengal, a world away from mainland India. Swaraj Dweep (Havelock) is small enough to cover by scooter, with jungle trails, empty beaches, a surprising number of restaurants and some of the best diving in the country. One afternoon in Sri Vijaya Puram (Port Blair) on the way back adds the history: the colonial Cellular Jail, where the British imprisoned India's freedom fighters."
