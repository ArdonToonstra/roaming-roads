  - time: Day 6
    locationName: Ushuaia
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na een turbulente vlucht komen we aan in de hoog zomer van Ushuaia en … het sneeuwt. We hebben een bergcamping geboekt bij een Argentijnse familie (maar is kamperen in de sneeuw wel zo’n goed idee 🥶). We wagen het erop en worden warm ontvangen. Er is gelukkig een gedeelde hut met een kacheltje waar we ons kunnen opwarmen en rustig kunnen koken. De eerste nacht is spannend: we hebben beide nog nooit in de sneeuw gekampeerd. Ons duur kampeer gereedschap bewijst zichzelf en we worden ‘s ochtends zonder koud wakker.

      Op de planning staat vier dagen wandelen. We beginnen met een eenvoudige hike in het nationaal park Tierra del Fuego. Mooie start maar wel wat toeristisch. De dag erna is de sneeuw verdwenen en trekken we via het modderige pad richting Glaciar Vinciguerra. We worden beloond met de schoonheid van de bergen en keren voldaan terug naar onze camping waar de familie ons uitnodigde voor een avondmaal. Om 19u zitten we klaar met enkele anderen van de camping om vervolgens om 00:00 aan tafel te kunnen aanschuiven 🤪 Ondanks dat de host wist dat we vegetarisch zijn, begint hij voor onze neus het vlees uit de stew te plukken. Lisa gaat met een lege maag naar bed… maar het was wel super gezellig!
