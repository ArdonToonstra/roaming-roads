  - time: Day 2
    locationName: Ambergris Caye
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Duiken in het gigantische Belize barrier reef!

      We doen 5 duiken en 1 snorkel trip en we zien zoooo veel haaien 🦈🦈 voornamelijk reef -en nursesharks. Op een bepaald moment zwemmen er wel 6 tegelijk onder ons en boven ons. Heel speciale ervaring! Verder zwemmen we door veel koraal canyons en enkele tunnels. Het is zeker de moeite! 🐟🐠🐡

      Ambergris Caye blijkt al snel een groot vakantiepark voor Amerikaanse families te zijn, en iedereen verplaatst zich met golf carts. Wij dus ook! Het brengt ons naar een strandje en verschillende barretjes.

      We hebben een leuke tijd maar zijn blij (vooral voor onze portefeuille) om weer verder te reizen naar Mexico. 🇲🇽🇲🇽
