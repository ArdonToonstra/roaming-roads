importantPreparations: |-
  - **Belize is expensive.** A studio with a kitchen cuts costs sharply on Caye Caulker, where eating out adds up fast.
  - **Bring cash.** Card acceptance is patchy on the smaller cayes.
  - **Allow a full day to get here** from Guatemala or Mexico. The trip means a bus, a land border and a ferry.
  - **Plan around the heat.** It is intense year round, so do anything active early or late.
  - **Book diving on Ambergris, not Caye Caulker.** The bigger island has the established shops and easier reef access.
itinerary:
  - time: Day 1
    locationName: Caye Caulker
    description: "A small, car-free island whose official motto is go slow, which the heat enforces regardless. Best approached with no itinerary at all."
    activities: |-
      - Walk the whole island in an afternoon. That is roughly how long it takes.
      - Watch the tarpon feeding at the dock, and look for seahorses and stingrays in the shallows.
      - Book a studio with a kitchen rather than eating out every meal.
      - Spend a day at one of the waterfront bars. That is more or less the point of the island.
    location:
      - -88.03367941
      - 17.73948765
    gallery:
      - media: belize-step01-caye-caulker-01.jpg
      - media: belize-step01-caye-caulker-02.jpg
