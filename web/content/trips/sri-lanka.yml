  - time: 3 days - 2 nights
    locationName: Ella
    description: "A town located in the hills of Sri Lanka with a laid-back atmosphere and unique attractions. "
    activities: |-
      - There are some 'must do's' in Ella like: 
      - 
        - Train spotting at Nine Arch Bridge
        - Climb Ella Rock 
        - Sunset at Little Adam's Peak 
      - But there are other, lesser visited, things to do as well. Rent a scooter and drive to:
      - 
        - The Buduruwagala Temple
        - Upper Diyaluma Waterfall
