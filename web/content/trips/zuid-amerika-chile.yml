  - time: Day 7
    locationName: "Día 5: Grey - Paine Grande (Torres del Paine)"
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na een helse nacht met veel wind worden we wakker onder een laag stof en zand in onze tent. 🌬️ Er zitten twee gaten in ons buitenzeil (hunk).

      Het is gelukkig een korte wandeldag en komen vroeg aan in de beste camping tot nu toe!

      Een avond met meer biertjes, Lama games en vroeg slapen. 🦙
    location:
