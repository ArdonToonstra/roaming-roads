title: Carretera Austral and the Lake District
status: published
category:
  - backpacking
  - road_trip
coverImage: chile-step20-cerro-castillo-01.jpg
description: "The long middle of Chile by road. Granite valleys at Cochamó, a rental car up the Ruta 7 through volcanoes, fjords and ferries, a four-day trek in Cerro Castillo, then north through the Lake District to Valparaíso and Santiago."
period: February – March 2024
budget:
  currency: EUR
  perPerson: true
activities: |-
  Road tripping

  Hiking and trekking

  Camping

  Rafting and canyoning

  Volcanoes

  Hot springs
added: "2025-12-26"
countries:
  - chile
importantPreparations: |-
  - **Rent a car for the Ruta 7.** Public transport along the Carretera Austral is thin and unreliable. A car also lets you pick up hitchhikers, which is how most travellers move here.
  - **Book the ferries.** Several sections of the Ruta 7 are only passable by ferry, and slots sell out in February.
  - **Buses in the Lake District are unpredictable.** Reaching Cochamó in particular can take a full day of waiting and cancelled rides. Build in slack.
  - **Camping gear pays for itself.** Campsites are cheap and plentiful, and the best spots in the national parks have no other option.
  - **Nights get cold.** Even in summer, mountain camps near Cerro Castillo drop to freezing.
  - **Hitchhiking is normal and safe here**, but competitive. Expect long waits in peak season.
itinerary:
  - time: Day 1
    locationName: Puerto Varas
    description: "A lakeside town below the Osorno volcano, and the obvious base for the northern Lake District. Comfortable, walkable and well connected."
    activities: |-
      - Walk the waterfront for views across Lago Llanquihue to the Osorno and Calbuco volcanoes.
      - Use the town to regroup and book onward transport before heading into the valleys.
    location:
      - -72.9829073
      - -41.317802
    gallery:
      - media: chile-step12-puerto-varas-01.jpg
    blockType: fullDay
  - time: Day 2
    locationName: Ensenada
    description: "A small settlement at the foot of the Osorno volcano, and a useful staging point when the direct buses to Cochamó fall through, which they often do."
    activities: |-
      - Break the journey here if connections fail. Buses toward Cochamó are infrequent and frequently rerouted.
      - Use the stop for volcano views and short walks on the lava fields.
    location:
      - -72.539717381
      - -41.206024187
    blockType: fullDay
    transportation:
      arrivalMethod: public_bus
      departureMethod: public_bus
  - time: Day 3
    locationName: Cochamó - Basecamp
    description: "The village at the mouth of the Cochamó valley, sometimes called the Yosemite of South America. A quiet base of campsites, a river and a local brewery before the walk in."
    activities: |-
      - Camp in the village and spend a day doing nothing before the hike.
      - Swim in the river, which is glacially cold year round.
      - Drink at the local cervecería and use the campsite fire pits in the evening.
    location:
      - -72.220495968
      - -41.455888387
