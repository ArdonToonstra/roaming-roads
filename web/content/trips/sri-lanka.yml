  - time: 2 days - 1 night
    locationName: Nuwara Eliya
    description: A cool & scenic hill town, known as "Little England". Famous for its temperate climate, tea plantations, waterfalls and misty mountain landscapes
    activities: |-
      - We stopped somewhere half way between Kandy and Nuwara Eliya (in Ramboda close to the tea plantations) to avoid the massa tourism in Nuwara Eliya. 
      - From here we visited a tea plantation and factory (Kingwood tea Factory for example), walked to the Ramboda waterfalls and visited an cute local food court. 
      - Don't forget to eat in one of the restaurants with amazing views over the hills.
      - After your visit in Ramboda, go to Nuwara Eliya and start the famous train ride to Ella! We bought our tickets at the train station but that seems to be a problem since the train ride became to popular..
