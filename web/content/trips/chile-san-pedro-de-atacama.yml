title: San Pedro de Atacama Desert Roadtrip
status: draft
category:
  - road_trip
  - backpacking
coverImage: chile-step30-lagunas-antiplatos-spda-01.jpg
description: "A week of self-driving and wild camping in the Atacama desert. Salt lagoons, geysers at 4,300 m, altiplano lakes and some of the clearest night skies anywhere, with San Pedro de Atacama as the only real town for hundreds of kilometres."
period: March 2024
budget:
  currency: EUR
  perPerson: true
activities: |-
  Road tripping

  Wild camping

  Stargazing

  Hot springs

  Salt lagoons

  High altitude hiking
added: "2025-12-26"
countries:
  - chile
importantPreparations: |-
  - **Rent a 4x4, not a car.** Many of the best roads are rough gravel. Punctures are common, so check the spare before leaving the airport and carry more water than you think you need.
  - **Altitude is the real constraint.** San Pedro sits at 2,400 m and the drives go well above 4,000 m. Expect to feel exhausted and dizzy for the first days, and plan a proper acclimatisation build-up before any summit attempt.
  - **Cerro Toco needs a permit** arranged in advance. The access road is gated for the astronomical observatories and turned away without one.
  - **There is no phone signal** outside San Pedro and Calama. Download offline maps and tell someone your route.
  - **Stock up in Calama.** San Pedro has small shops at tourist prices. The China Mall in Calama is the place for camping chairs, mats and other kit.
  - **Camp high for the stars, but bring shade.** Nights are freezing and the daytime sun is brutal with no natural cover anywhere.
itinerary:
  - time: Day 1
    locationName: Laguna Baltinache
    description: "A chain of hidden salt lagoons reached by a long, punishing gravel track. The salinity is high enough to float in, and the approach road is where most rental tyres meet their end."
    activities: |-
      - Drive the rough track slowly. Speeding over the corrugations is how tyres get destroyed out here.
      - Walk the loop between the lagoons before the midday heat.
      - Float in the salt pools, then rinse off. The salt crust is hard to remove later.
      - Find a wild camping spot before sunset. Look for flat ground with some wind shelter.
    location:
