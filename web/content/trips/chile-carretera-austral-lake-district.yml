    blockType: fullDay
  - time: Day 4
    locationName: Cochamó - Valley
    description: "A 12 km walk in to a valley of granite domes, waterfalls and swimming holes. It is a Chilean climbing and hiking hotspot with a relaxed, festival-like camp scene. Four days is better than two."
    activities: |-
      - Hike the 12 km valley trail to the campsite. The walk in is dull, the destination is not.
      - Cross the river by the cable trolley to reach the main trails.
      - Walk to the granite slide waterfalls, the classic day out here.
      - Climb to Laguna Trinidad, a 1,200 m ascent to a mirror-flat lake.
      - Arrange your ride out in advance and have a backup. Taxis here cancel without warning.
    location:
      - -72.125539759
      - -41.409557599
