  - time: 2 days - 1 night
    locationName: Wilpattu National Park
    description: "Do a safari in the biggest and older national park of Sri Lanka! See leopards, natural lakes, elephants,.. and many more! "
    activities: |-
      - Stay in one of the guesthouses around the park. They will happily arrange you with a safari ride in park. 
      - You can choose between half day and full day trips. The trips start at 5:30am because then you will have the best changes to see wildlife in the park. We paid $100/full day trip. 
      - Except a safari, there is not so much to do around here.
