  - time: 4 days - 3 nights
    locationName: Uyuni Salt Flats
    description: "Visit the world's largest salt flat: a white expanse formed from prehistoric lakes, famous for creating surreal mirror effects during the rainy season and for optical illusions, making it look endless and perfect for unique photos. "
    activities: |-
      - Take a night bus from La Paz to the town of Uyuni. To book bus tickets, you have to go to [the bus station](https://maps.app.goo.gl/NuXLp2tSjrTLavQz9) and visit the different bus stands to decide. 
      - Check-in your hotel and decided which trip you want to make to the Uyuni Salt Flats. The bus will arrive very early so it is also possible to start the Uyuni trip direct after the night bus. 
      - Don't worry about booking in advance. There are so many tour agencies and they all arrange the cars in the morning. 
      - We booked with [Uyuni Trans Adino](https://www.uyunitransandino.com/) and had a great experience. We did the 3 day tour with a group in a 4x4. Our driver and guide was amazing! We visited the salt flats, cactus mountains, we saw the most beautiful sunsets, slept in salt hotels, made funny pictures, saw alpaca's, flamingo's, geysers, hotsprings, .. and so much more! 
      - After the 3 day trip, we took the night bus to our next destination!
