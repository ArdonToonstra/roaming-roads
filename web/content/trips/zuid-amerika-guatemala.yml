  - time: Day 5
    locationName: Acatenango/ Fuego Vulcanes
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na een overnachting in Antigua maken we ons klaar voor het beklimmen van de Acatenango vulkaan om de aangrenzende én zeer actieve Fuego vulkaan van dichtbij mee te maken. Na een vroeg gemeenschappelijk ontbijt (met onze super leuke groep) in het familiehuis van de organisator hiken we zo’n 1200 meter loodrecht omhoog naar base camp. 🌋🌋

      Bij aankomst in base camp zien we enkel wolken, wolken en wolken. Wat we niet zien horen we wel al. Na compleet verschrokken te zijn van een harde knal komt er een grote glimlach bij iedereen op het gezicht. Hiervoor zijn we gekomen.💥

      Vanaf hier wordt het alleen maar beter (qua zicht 👀). Nu de wolken langzaam verdwijnen krijgen we een perfect zicht op de Fuego vulkaan. Terwijl Lies wat misselijk wordt van de lunch, vertrekt Ardon op een 4 uur durende extra hike naar de Fuego zelf om het van nog iets dichterbij mee te maken. Direct na vertrek slaat de volledige voedselvergiftiging in bij Lisa (details laten we achterwegen).🤮💩

      Later de avond mag Ardon er ook aan geloven. Net zoals de meerderheid in ons kamp… De volgende dag wordt Lisa, samen met een andere heel zieke vrouw, gerepatrieerd in een 4x4. Er blijkt een geheime achteruitgang aan de vulkaan te zijn! 🛻 De anderen, inclusief Ardon, worden niet ziek genoeg geacht en moeten naar beneden wandelen. Bij aankomst in het familiehuis laat de vrouw die ons ontbijt en lunch had gemaakt doodleuk weten dat er een serieus virus heerst en dat zij ook al enkele dagen serieus ziek is. Tot daar het raadsel van de voedselvergiftiging 🙄

      Na een vermoeide terugtocht kunnen we gelukkig vroeg inchecken in Antigua en beginnen met ons herstel (ondertussen volledig terug in orde). Ondanks alles was deze ervaring het alsnog zeker waard! 🔥
