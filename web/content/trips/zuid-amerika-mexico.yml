  - time: Day 1
    locationName: Bacalar
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      De voorlaatste stop van onze lange reis: Bacalar in Mexico - Laguna de los 7 colores. We starten direct met taco’s en corona’s. 🌮🍻

      Omdat Lisa hier 5 jaar geleden al eens is geweest zoeken we een originele activiteit: een middagje zeilen ⛵️We varen langs 5 verschillende stops waaronder 3 cenotes en een bird island. Het helderblauwe en zoete water is heerlijk!

      Hierna zwemmen we nog eens via de stijgers. Ons bezoek aan Bacalar sluiten we af met een goed restaurantje, biertje en cool uitzicht op een onweerstorm.⚡️
