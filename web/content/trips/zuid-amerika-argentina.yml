  - time: Day 4
    locationName: "Buenos Aires (1/2) "
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Wauw!! Geen idee waar te beginnen..

      Buenos Aires is gigantisch. Er valt overal en altijd iets te beleven. Die 8 dagen die we reserveerden om deze stad te verkennen, zijn misschien toch wat te weinig!

      Hier alvast een inkijkje in onze eerste 4 dagen aan onderdompeling in Buenos Aires:

      1️⃣ Ardon vergeet een tas met eten en spullen op de bus bij aankomst. Oeps.. 🫢 we waren allebei nog wat sleepy.

      2️⃣ We arriveren en settelen ons in een super leuk duplex appartementje.

      3️⃣ Onze eerste dag Spaanse groepsles.. blijkt een privéles te zijn. De drie andere studenten komen niet opdagen (verloren bagage, voedselvergiftiging en vertraging op de vlucht).

      4️⃣ Op dinsdag kunnen de groepslessen dan echt starten. We ontmoeten een Japaner die hopeloos op zoek is naar een Argentijnse vrouw, een Britse kokin die kookt op boten van Greenpeace en een mondige queer Palestijn. Gekke en gezellige bende!

      5️⃣ Elke middag hebben we tijd vrij om de stad te verkennen en ons Spaans hier en daar wat uit te proberen 💪 we gaan met een gids naar het indrukwekkenste kerkhof ooit, lopen door de botanische en Japanse tuinen, gaan shoppen in de hippe hotspot Palermo (waar Ardon zijn eerste handtas ooit koopt).

      6️⃣ We trakteren onszelf op een zeer fancy Tango avond met pick-up en diner! 💃 Nadien wordt Lisa 30 (!!) in de taxi terug naar huis.

      7️⃣ Ardon neemt Lisa mee naar het chiqueste vegan restaurant van Buenos Aires!

      Wordt vervolgd 🌇
