  - time: "2 nights - 3 days "
    locationName: "Madidi Jungle / Amazone visit "
    description: Visit the Amazone in Bolivia with Earth's most biodiverse rainforests and tropical jungle.
    activities: |-
      - From Coroico or La Paz, book a nightbus to Rurrenabaque. This is you starting point to a jungle trip or trekking. 
      - You have two choices here:
      - 
        - Do a Madidi Jungle stay 
        - Or do a Rurenabaque Pampas Tour 
      - We did a [3 days/2nights ](http://www.madidijungle.com/tareche.php)visit in the Madidi National Park with [Madidi Jungle ecolodge](http://www.madidijungle.com/). There where a lot of guided day and night hikes where we saw so many different birds, monkeys, special plants,.. The last day we went tubing in the river!
