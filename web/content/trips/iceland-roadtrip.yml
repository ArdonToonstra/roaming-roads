  - time: Day 9
    locationName: Reykjavík
    description: "The world's northernmost capital is small, walkable and lively, with colourful houses, the Hallgrímskirkja church on the hill and the Harpa concert hall on the harbour. It is a relaxed end to the trip, and close to the airport."
    activities: |-
      - Take the lift up Hallgrímskirkja for the view over the city.
      - Walk along the harbour to Harpa.
      - Soak in one of the city's geothermal pools, where locals go to talk, or at the Sky Lagoon on the coast.
      - Return the car and take the bus to Keflavík airport, about 45 minutes away.
    location:
