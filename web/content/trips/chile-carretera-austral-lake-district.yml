  - time: Day 9
    locationName: Cerro Castillo
    description: "A four-day trek from Las Horquetas through glaciers, lagoons and high passes. Far less known than Torres del Paine and every bit as good, with a fraction of the traffic."
    activities: |-
      - Start at Las Horquetas and walk the four-day route through the national park.
      - Expect basic camps: no showers, pit toilets, and water collected from the river.
      - Pack for freezing nights. Temperatures drop to around zero after dark even in summer.
      - Plan your exit. It is 37 km back to the trailhead with no buses or taxis, and hitchhiking here can take half a day.
    location:
