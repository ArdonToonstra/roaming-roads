  - time: Day 2
    locationName: "Capilla Del Señor "
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Next up: een 4 daagse roadtrip met kamperen door de Pampas (het platteland rond Buenos Aires)! Maar… ineens laat Hertz ons doodleuk weten dat ze ‘helaas toch geen auto voor ons hebben’. Last minute stellen we een Plan B samen en vertrekken met de trein richting Capilla Del Senor. 🚉

      Lisa schuift met haar beste Spaans aan bij de ‘boleteria’ en zo stranden we 1u later.. 20km verder van onze eindbestemming met 6 treintickets naar verkeerde bestemmingen. Woeps, sorry Ardon. 🫢 Dan maar een Ubertje dat ons naar een Paradijselijk hotel brengt met een groot zwembad!

      We relaxen, zwemmen, koken ons (gezond) eigen potje in de buitenkeuken, wandelen door het stadje. We starten een mooie hike over een oude spoorweg en komen overal paarden tegen. Uiteindelijk jagen de muggen ons op en moeten we leeggeprikt na enkele kilometers terugkeren naar ons hotel. 🦟

      1 ding is zeker: wij zijn hier de enige toeristen!
