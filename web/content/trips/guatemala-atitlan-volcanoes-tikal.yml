  - time: Day 6
    locationName: Semuc Champey
    description: "A natural monument of stepped limestone pools above a river, deep in jungle. The viewpoint above gives the classic shot, the pools themselves are the reward."
    activities: |-
      - Walk up to the mirador first for the view over the pools, then swim.
      - Allow a full day either side. The roads in are slow and rough.
