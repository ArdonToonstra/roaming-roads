  - time: 2 days - 1 night
    locationName: Somoto Canyon/ Estelí
    description: Located near the Honduran border, Somoto Canyon is one of the oldest rock formations in Central America, offering a rugged aquatic trekking experience. To the south lies Estelí, the industrial heart of Nicaragua’s tobacco region. This combination provides a transition from high-adrenaline river navigation to a deep dive into the world-class artisanal cigar industry.
    activities: |-
      - Somoto Canyon: get through a combination of hiking, swimming, and drifting with the river current. Cliff jumping from various heights into the deep canyon pools.
      - Stay at rural fincas to experience traditional northern Nicaraguan hospitality and cuisine.
      - Tour a professional cigar factory in Estelí to observe the fermentation and hand-rolling process.
      - Sample world-renowned cigars directly from the production floor in the global "cigar mecca."
