  - locationName: Reynisfjara, Reynisdrangar & Hálsanefshellir
    description: Black sand, basalt columns and sea stacks.
    activities: |-
      Reynisfjara is the famous black-sand beach west of Vík. Basalt columns rise at the end of the beach around the Hálsanefshellir cave, and the Reynisdrangar sea stacks stand just offshore.

      - **Take the warning signs seriously.** Sneaker waves reach far up the beach without warning and have killed visitors. Never turn your back on the sea, and stay well above the waterline.
    connectionType: side_trip
    location:
