  - time: Day 6
    locationName: Fingerrocks and Cerro Toco
    description: "Camping at 4,500 m among wind-carved rock pillars, with guanacos and vizcachas around the tent. The staging point for Cerro Toco at 5,600 m, if you have the permit."
    activities: |-
      - Camp high to acclimatise. The rock formations here make it the best wild site in the desert.
      - Watch for guanaco families and vizcachas at dawn and dusk.
      - Arrange the Cerro Toco permit well in advance. The access road is gated for astronomical research and there is no way around it.
      - Keep a fallback plan. The hot springs are a decent consolation if the summit is closed.
    location:
