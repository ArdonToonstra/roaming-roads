  - time: 6 days - 5 nights
    locationName: Little Corn Island
    description: Little Corn Island offers a stark contrast to the Nicaraguan mainland. This vehicle-free Caribbean island is defined by its Creole culture, limited infrastructure, and world-class marine biodiversity. With electricity typically restricted to specific daytime hours, the pace of life revolves around the ocean and the surrounding coral reefs. It is a premier destination for those seeking a disconnected, nature-focused retreat.
    activities: |-
      - Access the island via a domestic propeller flight to Big Corn followed by a local panga boat transfer.
      - Multi-tank scuba diving excursions to observe nurse sharks, eagle rays, barracudas, and green moray eels.
      - Experience night diving to view nocturnal marine life such as octopus, squid, and bioluminescent organisms.
      - Oceanfront yoga sessions or snorkel the shallow reefs directly from the white sand beaches.
      - Navigate the island entirely by foot, exploring secluded coastal paths and local Creole eateries.
      - Enjoy a lifestyle disconnected from motorized noise and consistent power grids.
    location:
