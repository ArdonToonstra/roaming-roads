  - time: Day 27
    locationName: "Laguna Baltinache (SPdA) "
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Een weekje kamperen en rondrijden in de woestijn van San Pedro de Atacama op de agenda! De woestijn blijkt al snel voor avonturiers te zijn 🌵⛺️🛻

      Op de luchthaven stappen we in onze suv-achtige auto. Onze eerste stop is de supermarkt en China Mall, waar we onze camping gear wat upgraden (stoelen, geimproviseerde tafel, stargazing matjes,..). We voelen al snel de extreme hoogte (uitgeput en dizzy) terwijl we naar onze eerste campingspot offroad zoeken (spannend 🤞). De zon begint onder te gaan en we vinden niet direct een effen plaats zonder te veel rotsen en wind. Uiteindelijk vinden we de spot: het landschap, zonsondergang en sterrenhemel zijn hier prachtig! 🌌

      ‘S ochtends vertrekken we naar Laguna Baltinache via een heeel moeilijke weg. Ardon adviseert Lisa om wat harder te rijden, ‘dan voelen we de bultjes en putten misschien minder’. Nadat we een prachtige wandeling maken en een lekkere lunch eten, zien we plots dat een van de banden volledig verwoest is 🫢 We besluiten om het probleem nog even te negeren.. en lekker te gaan zwemmen in het zout meertje, waar we ronddrijven.

      Ardon steekt daarna snel zijn handen uit de mouwen en heeft de band snel verwisseld naar de reserve. We hebben geen bereik dus rijden zo traag als mogelijk terug naar de luchthaven. Naar verrassing hebben we hier geen gezeik en krijgen een 3x zo grote 4x4 truck in de plaats (waar we al van droomden). Geluk bij een ongeluk! 🍀
