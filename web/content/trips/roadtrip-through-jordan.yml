description: "A diverse trip through Jordan: from the vibrant coral reefs of the Red Sea to the silent Wadi Rum’s desert. Visit ancient cities, wander through local markets, float in the Dead Sea and uncover the country’s rich culture and natural beauty at every turn."
period: May 2022
budget:
  amount: 1700
  currency: EUR
  perPerson: true
activities: |-
  - Diving in the red sea
  - Historical cities Petra, Jerash,..
  - Canyoning
  - Floating in the dead sea
  - Hiking in Dana National Park
  - Sleeping under the stars in de Desert 
  - ...
importantPreparations: |-
  - Buy your flights! We had tickets directly from Brussels to Amman for €220. 
  - Buy your travel permit in advance, through [the official site](https://moi.gov.jo/EN/Pages/Visa_E_Applications). It is also possible to buy a [Jordan Pass](https://www.jordanpass.jo/) which include a permit (40 days) and the entry of some of the highlights as Petra, Jerash, Wadi Rum,.. 
  - Rent a car. You will not need a 4x4 for this route. 
  - Install an eSim (only if you have eSim available on your phone).
  - Bring cloths that cover your shoulders en knees. 
  - Book a hotel for your first night.
