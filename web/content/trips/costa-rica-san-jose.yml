importantPreparations: |-
  - **Treat San José as transit.** Most travellers use it to connect onward to the coast, Nicaragua or Panama. One full day covers it.
  - **Costa Rica is expensive.** Budget roughly double what you would spend in Nicaragua or Guatemala.
  - **Carry small change for city buses.** Drivers can be impatient if your payment does not work, though other passengers tend to step in and help.
  - **Book border buses a day ahead.** Services to Nicaragua leave early and fill up.
itinerary:
  - time: Day 1
    locationName: San José
    description: "The capital and the country's main transport hub, with bus connections nationwide and across both borders. The centre gives up more on a guided walk than on an aimless one."
    activities: |-
      - Join a free walking tour. It is the fastest way to make sense of a city that does not reveal much on its own.
      - Eat at the central market, where the food stalls are the best value in town.
      - Try a sorbetera, a local ice cream flavoured with a mix of around a hundred spices.
      - Use the day to sort onward tickets and cash before moving on.
