  - time: Day 1
    locationName: Punta Arenas
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Punta Arenas in Chili is een praktische tussenstop ter voorbereiding van onze 8 daagse hike in Torres Del Paine! 🥾

      We lopen verschillende supermarkten af op zoek naar lichtgewicht en voedzaam eten. In een grote shopping mall vinden we wandelstokken en waterdichte wandelschoenen voor Ardon.

      We houden onze wandelspieren warm en proberen dagelijks flink wat kilometers af te leggen. Bijvoorbeeld in het Reserva Nacional Magallanes en tijdens een wandelingetje aan zee worden we verrast door een groep dolfijnen. 🐬 Verder is dit stadje niet om over naar huis te schrijven: vrijwel alle gebouwen zijn lelijk of storten half in.

      We zijn wel helemaal klaar voor onze volgende bestemming! 1 februari pas terug online 🛜
    location:
      - -70.907822
      - -53.1625688
    gallery:
      - media: chile-step01-punta-arenas-01.jpg
    blockType: fullDay
  - time: Day 2
    locationName: Unknown location
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Inpakken maar!

      Lisa propt haar kleine rugzak vol met 48 maaltijden, 16 porties soep en 24 energy bar.

      Ardon vult zijn grote rugzak met al de rest: tent, slaapzakken, matjes, reservekleren,…

      De rugzakken zijn (echt heel) zwaar, maaar we zijn helemaal klaar voor 8 dagen Torres del Paine! 🏔️🏔️
    location:
      - -72.507347612
      - -51.726062438
    blockType: fullDay
  - time: Day 3
    locationName: "Día 1: Central - Serón (Torres del Paine)"
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Tijdens de 3 uur durende busrit naar het park zien we al flamingo’s, struisvogels en guanacos aan de kant van de weg. Wauw! 🦩

      Helaas ontdekt Lisa al snel dat haar wandelschoenen nog nat zijn van de sneeuwstorm in Ushuaia (ohno) en Ardon verliest onze noodzakelijke waterfilter in de bus (weeral??). We beginnen met 2/0 achterstand 🫢

      Gelukkig schijnt de zon, is het een korte wandeldag door een mooie vallei en lijkt onze achterstand snel vergeten. We drinken bij aankomst een biertje op de goed uitgeruste camping en leren al snel onze medewandelaars kennen. We vallen om 20u30 als een blok in slaap in ons tentje.
    location:
      - -72.89007046
      - -50.860206289
    gallery:
      - media: chile-step03-dia-1-central---seron-torres-del-paine-01.jpg
      - media: chile-step03-dia-1-central---seron-torres-del-paine-02.jpg
