  - time: Day 3
    locationName: El Tatio Geysers and Valle de la Muerte
    description: "The third largest geyser field in the world, best seen just before sunrise when the cold makes the steam column up. A long day that also takes in two of the valleys closer to town."
    activities: |-
      - Camp strategically the night before and set an alarm for 05:00. The field is most active at dawn.
      - Dress for minus two. The cold is what makes the steam, and it is genuinely bitter up there.
      - Walk in the Valle de los Cactus on the way back toward San Pedro.
      - Sandboard the dune in the Valle de la Muerte, where no water has ever been recorded.
    location:
