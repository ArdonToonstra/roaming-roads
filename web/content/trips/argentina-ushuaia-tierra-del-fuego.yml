importantPreparations: |-
  - **Pack for winter even in high summer.** December to February is the hiking season, but snow, rain, wind and sun can all arrive within a few hours. Waterproofs, layers and a genuinely cold-rated sleeping bag are not optional.
  - **Camping gear earns its keep here.** A tent that handles wind and wet snow, plus a good sleeping mat, makes the difference between a rough night and a fine one. Many mountain campsites have a heated shared hut for cooking and drying gear.
  - **Download offline maps and GPS tracks.** Trail markers are sparse and disappear entirely in poor visibility; there is no phone signal on the passes.
  - **Ushuaia is expensive** compared with the rest of Argentina. Self-catering from the supermarket keeps costs down, and a cheap apartment in town is useful for drying out and repacking between treks.
  - **Vegetarians:** say so clearly and more than once, and carry backup food. Meat is the default in everything, including dishes described as vegetable-based.
  - **Dinner starts late.** An invitation for seven in the evening can mean sitting down to eat at midnight. Eat something beforehand.
  - **Onward to Chile:** buses to Punta Arenas take around twelve hours and cross two border posts. Book a day or two ahead and keep passports and any fresh food declarations to hand.
itinerary:
  - time: Day 1
    locationName: Ushuaia
    description: "Ushuaia lies between the Beagle Channel and the Fuegian Andes, and is the jumping-off point for Antarctic cruises, Tierra del Fuego National Park and the trekking routes in the mountains behind town. Family-run campsites in the hills above the centre are the cheapest base and put the trailheads within reach."
    activities: |-
      - Stay at one of the mountain campsites above town; most have a shared hut with a wood stove for cooking, warming up and drying gear.
      - Day hike in Tierra del Fuego National Park at the end of Ruta 3 — well marked and beautiful, though the busiest trails in the region.
      - Hike to Glaciar Vinciguerra, a longer and muddier climb starting close to town, with wide views over the surrounding peaks.
      - Use the town itself for resupply, laundry and onward bus tickets between hikes.
      - Accept dinner invitations from hosts and other campers; the shared meal is a large part of the experience, however late it starts.
