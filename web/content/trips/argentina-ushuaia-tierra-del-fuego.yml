coverImage: argentina-step06-ushuaia-01.jpg
description: "Tierra del Fuego from the southernmost city in the world. A compact base for four to six days on foot: an easy introduction in the national park, a glacier day hike straight out of town, and a two-day trek over a mountain pass to Laguna del Caminante. Expect four seasons in a single day — snow in midsummer is normal. From here it is a twelve-hour bus ride on to Chilean Patagonia."
