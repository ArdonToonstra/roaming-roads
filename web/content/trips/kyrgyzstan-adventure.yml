importantPreparations: |-
  - Buy your flights a couple of months before you planned to travel. We bought our tickets with Turkish Airlines from Brussel (with a layover in Istanbul) and payed €450/person. 
  - Choose a car rental and make a reservation in advance. We had great a great experience with [CAB car rental](https://cab.kg/). They are reachable through whatsapp 24/7 and give you a long explanation about where you can/ can not go. 
  - In case you want to go to Kel-Suu, buy your border permit in advance from [CBT Naryn](https://www.cbt-naryn.com/). You can send an email to [info@cbt-naryn.com](mailto:info@cbt-naryn.com) or whatsapp [(+996) 559 567 685](tel:+996559567685). They will arrange a permit for Kel-Suu (€20/person) or other permits if needed. 
  - Make a hotel/guesthouse reservation for you first night, so you can arrive in Bishkek without worries! 
  - It is obligated to carry a copy of your passport. Make a copy at home and bring it on your journey. 
  - Choose a translation app like Google Translate and download Dutch, English, Russian and Kyrgyz). 
  - Download offline driving and hiking maps of all the regions you like to visit (Google Maps, MapsMe, WikiLoc,..).
