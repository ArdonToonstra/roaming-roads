  - time: "2 days - 2 nights "
    locationName: Potosí
    description: "Visit a historic city high in the Andes, famous as the site of the massive silver-rich Cerro Rico (\"Rich Mountain\") with active mining. "
    activities: |-
      - Don't rush. This town is at 4060 meters high, so you will need time to acclimatize. 
      - Visit the 'Cerro Rico' mines with old mine workers so you will get a good understanding about the conditions of the workers. They will not take you through dangerous tunnels or places. You can book it through whatsapp. Find their contactinformation on [their website](https://bigdealtours.blogspot.com/). 
      - You will learn about the history of the town, the active mining, the cooperations, their beliefs,.. after the mines, you will also visit a refining factory. 
      - Eat lava soup in the evening!
