itinerary:
  - time: Day 1
    locationName: Aankomst @ Ayros-Arbouix
    activities: |-
      Vrijdagavond samen frietjes eten bij Bar Leon! Daarna vroeg slapen en vroeg op.

      Na 12u rijden komen we aan in ons cute huisje in de Pyreneeen. Kacheltje aan en chillen 🔥
    location:
      - -0.0656027
      - 43.0042725
    blockType: fullDay
  - time: Day 2
    locationName: Wandelen @ Hautacam
    activities: We rijden naar Hautacam voor een hike naar een mooi meertje. De Franse lachen met ons omdat we geen snowshoes hebben. We zakken helemaal weg in de diepe sneeuw en keren al snel terug naar het restaurantje op de piste en maken daarna een makkelijkere wandeling met super mooie views 🥾❄️⛰️
    location:
      - -0.0075484
      - 42.9719895
    blockType: fullDay
  - time: Day 3
    locationName: Skiën @ Cauterets
    activities: |-
      Dagje skiën in Cauterets ⛷️🎿🚠

      Daarna spieren ontspannen in de Thermen in het dorp. Buikje nog vullen in een lekker restaurant en daarna richting ons huisje.
    location:
      - -0.114546
      - 42.8893451
    blockType: fullDay
  - time: Day 4
    locationName: Biathlon @ Val d’Azun
    activities: |-
      We starten de dag met een echt Frans marktje en slaan baguettes, fromages,.. in 🧀

      Daarna initiatie Biathlon! En ook eerste keer langlaufen voor ons allemaal. 🎿 Fabien legt ons de basics uit en moeten daarna al snel schieten met lasers en bucks. We eindigen met een spannende wedstrijd: een parcours met schieten onderweg!

      In de middag maken we nog een grote langlauf tour en gaan uitgeput terug naar ons huisje 💪
    location:
      - -0.1937854
      - 42.9736799
    blockType: fullDay
  - time: Day 5
    locationName: Skiën @ Gavarnie
    activities: Skiën in het geheim skigebied van Gavernie. Zo mooi en rustig! Daarna kacheltje thuis aansteken en gezellig gezelgschapspelletjes spelen 🃏
    location:
      - -0.0093524
      - 42.7322036
    blockType: fullDay
  - time: Day 6
    locationName: Raquette & raclette @ Barèges
    activities: In Bareges huren we raquettes 🏸 en klimmen de berg op in de sneeuw. Boven wacht er een prachtig terrasje op ons! Na de terugkeer verwennen we onszelf nog eens in Thermes met een warme hammam en sauna. De dag eindigen we met een heerlijke raclette 🧀
    location:
      - 0.0622368
      - 42.8958816
    blockType: fullDay
  - time: Day 7
    locationName: "Skiën @ Grand Tourmalet "
    activities: |-
      De laatste dag is al weer aangebroken! We gaan deze keer naar het grootste skigebied van de omgeving: Grand Tourmalet! ⛷️

      Aan het einde van de dag begint het te sneeuwen om komen we in een winter wonderland terecht. Een laatste keer warm voor de kachel, inpakken en ‘s ochtends vroeg vertrekken richting Antwerpen en Rotterdam 🥲

      Tot snel mooie bergen! 🏔️
    location:
      - 0.1776751
      - 42.9119184
    blockType: fullDay
