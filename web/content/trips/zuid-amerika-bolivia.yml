  - time: 3 days - 2 nigths
    locationName: Huayna Potosi (6.088m)
    description: "Huayna Potosí is a 6,088-meter glaciated peak in Bolivia's Cordillera Real, known as one of the world's most accessible 6,000-meter mountains. It offers a challenging glacier travel, crevasse fields and stunning Andean views. "
    activities: |-
      La Paz is in the middle of the Andes and the perfect starting point for a hiking/mountaineering trip. There are different options, but if you don't have mountaineering experience: the Huyana Potosi is the accessible option. Don't get me wrong: you will have a hard time! 

      We booked with [Hiking Bolivia Tours](https://maps.app.goo.gl/ceh7ukjm3cV4iE2dA) and did the 3 days - 2 night trip. You will climb to 6,088 meters, so time to acclimatize is necessary. We had a private guide and everything was very well organized. They informed us well in advance and the equipment and organization was great! Don't start this hike if your level of fitness is not adequate. 

      - **Day 1**: You will pick up all the gear you need at the travel agencies. Once packed, the group travels to one of [the basecamp huts](https://maps.app.goo.gl/BYmFKqDrVkcGM5sY6). From there, you do a ice climbing and other exercise close to the camp. 
      - **Day 2:** The next day, you start the hike to 5,200 meters high to the next camp. You will not get a lot of sleep here, the altitude will make you sleep very light. 
      - **Day 3**: You will start in the ascent (around 6 hours) in the middle of the night. Bring coca and chocolate to give you some extra powers. Once you arrive at the top, you can only stay there for around 15 minutes and start the descend (4 hours). You walk all the way back to basecamp and take the car back to La Paz. 

      Good luck!
