      departureMethod: boat
  - time: Day 2
    locationName: Ambergris Caye
    description: "The larger and far more developed island, closer to a resort town than a backpacker stop, where everyone moves by golf cart. The diving is the reason to come."
    activities: |-
      - Dive the barrier reef. Five dives plus a snorkel trip covers the coral canyons and tunnels well.
      - Expect sharks on nearly every dive, mostly reef and nurse sharks, sometimes six circling at once.
      - Rent a golf cart, the standard transport here, to reach the quieter beaches and bars.
      - Budget carefully. This is usually the most expensive stop on a Central American route.
    location:
