importantPreparations: |-
  - Buy your flights! We had tickets to Colombo for €850/person with Qatar Airlines (transfer in Doha). 
  - Buy your travel permit in advance, through [the official site](https://www.eta.gov.lk/slvisa/). This will cost you around $50 for 30 days. 
  - Install an eSim (only if you have eSim available on your phone).
  - Bring cloths that cover your shoulders en knees if you want to visit the Buddhist temples. 
  - Book a hotel for your first night. 
  - Arrange a taxi from the airport to your first destination. We arranged all our taxi rides with Less Taxi (they have amazing whatsapp communication). 
  - Good to know: We booked all our transport with Tuktuks and Taxi's. Public transport is complex and will take more time.
