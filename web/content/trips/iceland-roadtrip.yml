  - time: Day 8
    locationName: Húsavík
    description: "A harbour town on Skjálfandi bay and the whale-watching capital of Iceland. Humpback whales are seen on most trips in summer and early autumn, and sometimes blue whales too."
    activities: |-
      - Go whale watching. The traditional oak boats are the classic choice, and the fast RIBs get closer.
      - Visit the Whale Museum by the harbour.
      - Soak in the GeoSea baths on the cliffs above town, overlooking the bay.
    location:
