  - time: Day 8
    locationName: Coyhaique
    description: "The largest town in Aysén and the main resupply point on the southern Carretera Austral. Roughly eight hours of rough, mostly unpaved road to get here."
    activities: |-
      - Stock up. This is the last proper supermarket before Cerro Castillo.
      - Pick up hitchhikers on the way in. It is the normal way to travel this road and a good source of route advice.
      - Camp on the edge of town and sort gear for the trek.
