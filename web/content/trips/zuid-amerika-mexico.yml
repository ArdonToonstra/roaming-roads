  - time: Day 2
    locationName: Akumal
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      We eindigen onze lange lange reis met een knaller: Cenote Diving! 🤿 Na aankomst in Akumal, komt onze dive instructor mee iets drinken in een strandbar om onze duiken voor te bereiden. ‘S ochtends worden we opgehaald en een professionele fotograaf blijkt ook mee te gaan!

      Na een uitgebreide briefing over de veiligheidsregels en de duikroute zwemmen we langs prachtige stalagmieten en stalactieten, zien we fossielen van schelpen, vissen en koraal en in een batcave komen we even boven water. Na een eerste succesvolle duik wordt onze buoyancy (onderwater controle van drijfvermogen) goed genoeg geacht om een gevorderde cenote dive te doen: cenote ‘Tak Bi Ha’ met stukken van maar 1.2 meter doorgang. 😎 De professionele foto’s en filmpjes van deze duik volgen nog!

      Perfect om onze reis zo af te sluiten! De hurricane die in Bacalar gestart is, volgt ons tot in Akumal. Tussen de buitjes drinken we nog wat corona’s op het strand. Zwemmen in de twee privécenotes in onze glamping is helaas niet mogelijk (het kristalheldere water is nogal bruin).

      En dan is het tijd om onze koffers te pakken en richting de luchthaven te vertrekken. 🥲🛩️
