    locationName: Fingerrocks/ Cerro Toco (SPdA)
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Omdat we moeten acclimatiseren voor de vulkaan hike morgen (Cerro Toco), zoeken we een kampeerplaats hoog gelegen. Na enkele plaatsen af te rijden, vinden we de mooiste kampeerplaats van de hele woestijn (op 4500 meter). We zetten ons tentje op in een soort nationaal park met super speciale ‘fingerrocks’. 🗿Naast de zonsondergang, sterrenhemel en zonsopgang, worden we hier ook getrakteerd op dieren: guanaco families en konijntjes huppelen voorbij.

      ‘S ochtends breekt de grote dag aan: we willen naar de top van de Cerro Toco op 5600 meter klimmen! 🌋 We hebben een heel acclimatisatieplan gemaakt. Als we de weg inslagen naar het startpunt, blijkt al snel dat het gebied afgesloten is wegens sterrenkundig onderzoek. Om aan de ingang te komen, zouden we vooraf een permit moeten aangevraagd hebben.

      Jammer maar helaas! In plaats van een dag van fysieke uitputting en hoofdpijn, keren we terug naar onze privé hotsprings van een van de eerste dagen en chillen daar!
