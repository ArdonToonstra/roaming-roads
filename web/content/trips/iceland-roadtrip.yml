    blockType: waypoint
  - locationName: Sólheimasandur plane wreck
    description: A US Navy plane on a black-sand plain.
    activities: |-
      A US Navy DC-3 crash-landed on the sand here in 1973, and its fuselage has stayed on the plain ever since. Everyone on board survived.

      - The walk from the car park takes about an hour each way over flat, featureless sand. A shuttle bus runs it too.
      - Go early or late in the day for fewer people and better light.
    connectionType: route
    location:
      - -19.3544968
