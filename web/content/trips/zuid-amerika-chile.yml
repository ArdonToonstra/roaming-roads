  - time: Day 12
    locationName: Puerto Varas
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      We komen na een lange reis uit Amersfoort terug aan in Chili (2000 km noordelijker van waar we vertrokken zijn). Wegens 8u vertraging (3u in Madrid en 2 gemiste vluchten in Santiago) moeten we onze plannen omgooien en boeken een comfortabel appartementje in Puerto Varas. Een leuk stadje aan het water!

      Morgen proberen we ons plan verder te zetten: Kamperen in de Cochamo vallei!
