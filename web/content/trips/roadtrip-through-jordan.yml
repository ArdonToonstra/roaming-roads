    activities: After a peacefull night with beautiful views over the Nature reserve, do the Wadi Ghuweir Trail. This is a beautiful trail through a canyon. Either you go to [the entrance](https://maps.app.goo.gl/QJNdH5mUPXjuB8fEA) yourself and do a one way and back trip, or you book a guide (in the Dana town or in your lodge) with pick-up and the end of the trail. This is a full day trip and you will walk about 15km. You will walk through the water in the canyon, so take proper shoes.
