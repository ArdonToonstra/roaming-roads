  - time: 2 days - 1 night
    locationName: Reserva Natural Miraflor
    description: Located in the northern highlands near Estelí, the Miraflor Nature Reserve is a high-altitude sanctuary known for its diverse microclimates and traditional farm-stay culture. Accessible via rugged roads that wind through expansive tobacco plantations, the area offers a cooler climate and a retreat into the Nicaraguan countryside. The reserve is characterized by its agricultural heritage, private waterfalls, and a high density of tropical birdlife, providing a focused look at rural life away from the primary tourist circuit.
    activities: |-
      - Navigate the scenic backroads and tobacco plantations by car for access to remote areas.
      - Stay at a traditional finca (farm) to experience life among coffee and banana plantations.
      - Hike through the forest to reach secluded waterfalls and natural swimming spots.
      - Observe native bird species such as motmots, hummingbirds, and toucans from the finca gardens.
      - Take advantage of the higher elevation for outdoor activities in more temperate conditions.
