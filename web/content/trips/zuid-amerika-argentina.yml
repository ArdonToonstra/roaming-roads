  - time: Day 3
    locationName: San Antonio des Areco
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Genoeg gechilled aan het zwembad, op naar het volgende stadje: San Antonio des Areco. We proberen opnieuw het openbaar vervoer te gebruiken… weer zonder succes: Capilla del Señor is officieel een gehucht!

      We verblijven in een zeer verouderde hospedaje, dat wat weg heeft van een klooster. We zijn de enige gasten en krijgen de volledige bos sleutels van het verblijf.

      ✅ Museum bezocht op aanraden van onze host (na 1,5u hebben we nog steeds geen idee waar het het museum eigenlijk over gaat. Een schilder, een cowboy, een taverne uitbater,..? Het heeft iets met Gauchos te maken 🤔😂)

      ✅ Gezwommen in de plaatselijke rivier

      ✅ In een oud barretje een echte Stella Artois gedronken!

      We nemen de bus richting Buenos Aires -> het is echt hoog tijd voor die Spaanse les!
