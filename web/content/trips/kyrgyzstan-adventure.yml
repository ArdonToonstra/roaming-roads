  - time: 1 dag - 1 night
    locationName: Kel-Suu
    description: "Gorgeous lake close to the border with China. "
    activities: |-
      **Important!!** If you are travelling in June, please ask around and make sure there lake is already filled with water. Before June there is no water in the lake (we saw videos). It is a long drive so make sure it is worth if! 

      On your way to the lake, make a stop in Naryn town. This will be the last place to buy groceries and take money from the ATM. 
      After this stop, continu driving to the south and look for a quiet wild camping spot. You will need a whole driving day for this trip. We camped at a spot we found on iOverlander. The valley in front of the lake is busy with Yurt Camps. So if you want more luxery, search for a camp there. 

      The next morning, drive to the starting point of the hike. You can drive through all the Yurt Camp until the road stops and you will see a small parking lot. 

      The hike is an easy 9 km return. At the lake there is a possibility to rent a boat. From the hiking stop, you only see a glimpse of the lake. 

      Be aware: Despite the isolated location, this lake is more popular than others. Tour buses and groups with horses will also go to the lake.
    accommodation: wild-camp-spot-around-kel-suu-lake
