  - time: Day 7
    locationName: Tikal National Park
    description: "One of the largest Maya cities, deep in the jungle of the Petén. Flores, a small island town on a lake, is the usual base for two nights."
    activities: |-
      - Base yourself in Flores and take a morning tour out to the ruins.
      - Go early. Outside peak hours Tikal can be almost empty.
      - Watch the jungle as much as the temples. Toucans, monkeys and tarantulas are common along the paths.
      - Spend leftover quetzales before crossing into Belize.
