  - time: Day 24
    locationName: Familie reünie @ Olmué
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Nico, de peter van Lisa, staat ons op te wachten in de luchthaven van Santiago en brengt ons naar Olmué, het dorpje waar hij samen met Paulina, Elena en Manu 12 jaar geleden naartoe is verhuisd. We komen aan in een klimaat waar het vol met cactussen staat en Lisa het nooit te koud heeft (30 graden). Het voelt als een vakantie op onze vakantie! 🌞

      ✅ We genieten dagelijks van het zwembad en drinken Chileense biertjes op het terras. Met uitzicht op de vele kolibries die langs komen.

      ✅ Voor Paulina haar bedrijf gaan we resttomaten plukken en maken we een batch pasata.

      ✅ Op de lokale zondagsmarkt proberen we Mote con Huesillos, een Chileens drankje met granen en gedroogde perzik. Speciaal!

      ✅ We bezoeken een marktje met een parade van Chino’s met zeer speciale (en onuitstaanbare) muziek. Zie het filmpje.

      ✅ Met ze’n tweetjes doen we een wandeling van 17 km door het nationale park La Campana.

      ✅ Nico brengt ons naar de grenspost met Argentinië, diep in de Andes op 3000m. Na 30 haarspeldbochten komen we aan een mooi meer met uitzicht!

      ✅ Paulina leert ons de vegetarische Chileense keuken kennen, zoals Charquicán de Cochayuyos (enge zeewier slangen). Ze stuurt ons ook naar Katty, de lekkerste empanadas van Chili!

      We chillen een weekje in de Chileense huize Moreels en leren veel over de normen, waarden, cultuur en hospitality hier. We laden onze batterijtjes (letterlijk en fysiek) op en zijn klaar om weer verder te gaan. Volgende halte: Valparaiso en Viña del Mar 🏖️
    location:
