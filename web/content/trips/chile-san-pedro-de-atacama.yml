  - time: Day 2
    locationName: Termas Bajas
    description: "An oasis village campsite with actual facilities, then the long climb toward 4,400 m past flamingo lakes and volcano viewpoints. A canyon walk at the top leads to small private hot spring pools."
    activities: |-
      - Use the oasis campsite for a swim and a proper wash before heading back into the deep desert.
      - Drive past the flamingo lagoons and volcano viewpoints, watching for vicuñas and guanacos.
      - Walk the canyon to the hot springs once the afternoon cools. Move slowly at this altitude.
    location:
