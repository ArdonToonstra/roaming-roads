  - time: Day 16
    locationName: Hornopirén
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Hornopirén: onze eerst stop op de Ruta 7!

      ✅ Eerste keer raften voor ons beide. Super leuk!

      ✅ Kamperen aan de ingang van het nationale park + korte hike door het park

      ✅ Lokaal honingfestival waar we verschillende gerechtjes proberen zoals gefrituurd brood met saus (zie foto).

      ✅ Ardon houdt een tor als huisdier op onze camping, die met ons mee eet en drinkt.

      ✅ Stevige klim via een ‘derrumbe’ naar romantische zwemplaats met uitzicht!
