  - time: Day 13
    locationName: Olmué
    description: "A village inland from Valparaíso, in cactus country at the foot of La Campana National Park. Hot, dry and green, and a common weekend escape from Santiago."
    activities: |-
      - Hike the 17 km route through La Campana National Park.
      - Try mote con huesillos at the Sunday market, a local drink of wheat grains and dried peach.
      - Drive up to the Andean border post with Argentina at 3,000 m, around thirty hairpins up to a mountain lake.
      - Eat the vegetarian side of Chilean cooking, such as charquicán de cochayuyo made with sea kelp.
    location:
