  - time: Day 3
    locationName: San Juan La Laguna
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Ooit al een sjaal geweven? Wij nog niet, dus plannen we een weefworkshop in hét dorp van de weefambacht in Guatemala. Z’n 4 uur zijn we bezig met het onder de knie krijgen van het weefproces. Lisa haar sjaal is zooo lang dat de pro’s uiteindelijk komen helpen, ondertussen spelen wij gezelschapspelletjes met hun zoontje. 🃏🧣

      Lisa boekt achter Ardon’s rug het goedkoopste hotel dat er te vinden is als experiment. Wat de kamer aan wensen overlaat maakt San Juan goed (we kunnen er ondertussen al mee lachen 😂). Het is een mooi dorpje vol kleur, muurschilderingen en natuurlijk winkeltjes met hand geweven stoffen. We blijven hier maar één nachtje en reizen met de boot alweer verder naar een volgend dorp aan het meer. 🚤
    location:
