  - time: 3 days - 2 nights
    locationName: Granada
    description: As one of Central America's oldest colonial cities, Granada is defined by its vibrant architecture and its role as a social crossroads for travelers. The city serves as a primary gateway for both high-energy jungle nightlife and the tranquil volcanic landscapes of the surrounding region. Given the intense tropical heat, exploration is often balanced between historical walking tours and retreats to nearby water sources or air-conditioned spaces.
    activities: |-
      - Attend the Treehouse Party, a famous jungle event featuring multiple stages connected by suspension bridges.
      - Explore the historic city center to view the preserved colonial buildings and cathedrals.
      - Visit Laguna de Apoyo, a volcanic crater lake known for its warm waters, ideal for swimming, tubing, and lakeside lounging.
      - Experience the international food scene, including popular spots like the local falafel bars.
      - Use the city as a strategic base to store heavy luggage or camping equipment before transitioning to a lighter daypack for the next leg of the journey.
    location:
      - -85.9535897
      - 11.9303801
