  - locationName: Hverir
    description: Boiling mud and steaming vents.
    activities: |-
      A geothermal field below Námafjall, with orange and yellow ground, bubbling mud pots and roaring steam vents, and a strong smell of sulphur.

      - Stay on the marked paths. The ground crust can be thin and the mud is boiling hot.
      - Walk up Námafjall for a view over the whole area.
    connectionType: route
    location:
      - -16.809182
      - 65.6411434
    gallery:
