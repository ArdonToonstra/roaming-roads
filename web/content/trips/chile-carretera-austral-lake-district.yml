  - time: Day 6
    locationName: Chaitén Volcano
    description: "Reached by a six hour ferry with sea lions along the way. The still-smoking Chaitén volcano sits in Pumalín Douglas Tompkins park, land donated to Chile by the founder of The North Face."
    activities: |-
      - Take the ferry from Hornopirén and watch for sea lions hauled out along the route.
      - Climb the Chaitén volcano for views over the caldera, where vents still smoke.
      - Look for hummingbirds on the pink flowers growing across the volcanic soil.
      - Camp by one of the lakes in the park. Sites are basic and often unstaffed.
    location:
