  - time: Day 2
    locationName: Akumal
    description: "The base for cenote diving on the Riviera Maya, an hour south of Playa del Carmen. Dives run through flooded cave systems of stalactites, fossils and air pockets."
    activities: |-
      - Dive the cenotes for stalagmites, stalactites, shell and coral fossils, and a bat cave where you surface mid-dive.
      - Ask about Tak Bi Ha if your buoyancy passes the first assessment. It includes sections only 1.2 m wide.
      - Keep beach days flexible in storm season. Private cenotes silt up brown after heavy rain.
      - Use Akumal as the final stop before flying out of Cancún, around two hours north.
