  - time: Day 1
    locationName: Antigua Guatemala
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na een flinke reisdag komen we aan in Guatemala. 🇬🇹 We skippen Guatamala-city en gaan direct naar Antigua. Dit was een top beslissing! Antigua is een mooi, relaxed stadje omringd door vulkanen en gevuld met hippe horeca. De temperatuur is hier heeerlijk!

      Tot zover zijn alle guatamalezen super vriendelijk en is het leuk om weer meer cultuur op straat te zien, bijvoorbeeld de kleurrijke traditionele klederdracht, maskers, gebouwen,.. 🌈

      In een volle dag verkennen we Antigua. We bekijken mooie kerken en gebouwen, leren over de kunstgeschiedenis van Guatamala in een museum en beklimmen een heuvel met uitzicht over de stad. De volgende dag pakken we een shuttle richting lake Atitlan.
