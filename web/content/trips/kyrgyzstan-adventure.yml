    locationName: Kegeti gorge
    description: "Last stop on this beautiful journey. "
    activities: |-
      A climb to a very blue lake close to Bishkek. You can stay in Tazabak Guesthouse. Great price and very good food and friendly owners. 

      From here it is 20 min driving further in the valley until you reach the starting point of the hike. The trail is 11km return and 825m climbing. 

      We started early and were alone at the lake. Other tourist are coming from Bishkek and will arrive later.
