  - time: 2 days - 1 night
    locationName: Anuradhapura
    description: Visit Sri Lanka's first ancient capital, a UNESCO World Heritage site known for its vast ruins of palaces, monasteries and massive stupas.
    activities: |-
      - You visit Anuradhapura for the culture. It is advisable to visit it with a guide who can explain about the history. 
      - We booked a guide in our hotel who took us with the Tuktuk on a full day tour. Some of the temples are very expensive, that's why we decided to only visit the free sites and see the big temples from the outside.
      - The guide took us to different places in Anuradhapura. In the evening he also brought us to Mihintale (where buddhism originated) where we climbed the stairs to the beautiful stupa and view over the jungle. 
      - On you way to the next stop (Kandy) you can also visit the famous Sigiriya rock.
