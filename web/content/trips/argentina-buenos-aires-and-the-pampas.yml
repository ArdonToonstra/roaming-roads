  - time: Day 2
    locationName: Capilla del Señor
    description: "A small country town in the Pampas roughly 80 km from Buenos Aires, reachable by regional train. There is effectively no tourism here — no English, few services and very little onward public transport — which is exactly the appeal. A handful of rural hotels on the edge of town offer pools and outdoor kitchens at prices well below the capital."
    activities: |-
      - Base yourself at one of the rural hotels outside town; most have a pool and a shared outdoor kitchen for self-catering.
      - Walk into the town and through its streets — you will likely be the only foreign visitors there.
      - Hike the disused railway line running out of town, past horse paddocks and open farmland.
      - Bring serious mosquito repellent: the marshy sections along the railway are brutal at dusk.
      - Budget for taxis or rideshares. The station is not always where you expect it, and connections between Pampas towns are unreliable.
    location:
      - -59.0991865
      - -34.2941087
    gallery:
      - media: argentina-step02-capilla-del-senor-01.jpg
    blockType: fullDay
    transportation:
