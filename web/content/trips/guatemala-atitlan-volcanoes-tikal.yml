importantPreparations: |-
  - **Skip Guatemala City.** Shuttles run straight from the airport to Antigua, which is a far better base and only an hour away.
  - **Choose the Acatenango operator carefully.** It is a 1,200 m climb to a camp opposite an active volcano and standards vary a lot.
  - **Stomach illness is common on the Acatenango trek**, and is often traced to the food the operator provides rather than to the altitude. Ask how meals are handled and carry backup food of your own.
  - **Bargain at the markets.** Chichicastenango sellers routinely drop from 300 to 50 quetzales without being pushed.
  - **Lanchas are the transport around Lake Atitlán.** Boats between the villages are frequent and cheap, so village hopping is easy.
  - **Pack layers.** The highlands are mild by day and cold at night, and genuinely cold on the volcano.
itinerary:
  - time: Day 1
    locationName: Antigua Guatemala
    description: "A colonial town ringed by volcanoes, with a mild climate and a dense cafe and restaurant scene. The standard first stop and the launch point for the Acatenango climb."
    activities: |-
      - Spend a full day on the churches, ruins and colonial streets.
      - Visit the art history museums for background on Guatemalan and Maya culture.
      - Climb Cerro de la Cruz above town for the view across to the volcanoes.
      - Take a shuttle onward to Lake Atitlán. They run daily and take about three hours.
