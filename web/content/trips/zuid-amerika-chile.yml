      Op zoek naar een restaurantje zien we een Diablada, een duivelsdans. De dansers zijn verkleed en maken er een grote show van! Buiten dit is Calama verder niet om over naar huis te schrijven.

      De ochtend erna vertrekken we met veel goesting naar Bolivia! De grensovergang is al een groot avontuur. Dat belooft voor de komende weken!
