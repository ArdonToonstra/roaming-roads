  - time: Day 4
    locationName: Lagunas Altiplánicas
    description: "High altitude lakes at around 4,000 m: Miscanti, Miñiques and Piedras Rojas. Timed entry slots apply, so plan the drive around them."
    activities: |-
      - Book a time slot for the lagoons and plan the route around it.
      - Visit Miscanti, Miñiques and Piedras Rojas in one loop, watching for flamingos and altiplano birds.
      - Picnic among the rocks. There is nowhere to buy food once you leave San Pedro.
      - Spend an evening in San Pedro itself. The adobe centre is largely car-free and has good bars and vegetarian food despite the tourist crowds.
    location:
