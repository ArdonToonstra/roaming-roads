importantPreparations: |-
  - **Season.** The dry season, roughly November to April, is the time for calm seas and good visibility. The monsoon arrives around May and turns ferries and dive trips unpredictable.
  - **Getting there.** The islands lie more than 1,000 km off the mainland. Flights from Delhi, Chennai, Kolkata and other big cities land at Sri Vijaya Puram (Port Blair), the only real gateway.
  - **Book ferries ahead.** The private catamarans to Swaraj Dweep are quick and comfortable, but they sell out in high season. Government ferries are cheaper but slower and harder to book. Fix your ferry before you fix your flight back.
  - **Entry formalities.** The permit and registration rules for foreign visitors have changed several times. Check the current requirements before you book, especially if you want to go beyond Swaraj Dweep and Shaheed Dweep (Neil). The Nicobar Islands are closed to tourists.
  - **Cash and connectivity.** ATMs on Swaraj Dweep are few and not always stocked, and mobile data is slow and patchy. Bring enough cash from Port Blair and download offline maps.
  - **Diving.** Book a dive centre on Swaraj Dweep rather than doing day trips from Port Blair: the good sites are right off the island. Bring your certification card, and leave 24 hours between your last dive and the flight out.
itinerary:
  - time: Days 1–7
    locationName: Swaraj Dweep (Havelock) — diving
    description: "After the chaos of Delhi, Swaraj Dweep feels like stepping into a different country: warm air, palm-lined roads and a slow island pace. The island was renamed from Havelock in 2018, but both names are in everyday use. It is the diving hub of the Andamans, with a cluster of dive centres along the east coast and reefs, walls and pinnacles a short boat ride away."
    activities: |-
      - Plan around a week on the island, with time for eight or so dives spread over several days.
      - Expect healthy coral, big schools of reef fish, turtles and the occasional reef shark.
      - Ask your dive centre about the deeper sites further out for more experienced divers. Conditions decide the plan, so stay flexible.
      - Mix dive days with lazy days: nitrogen, sun and heat add up quickly.
