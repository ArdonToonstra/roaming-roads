  - time: 2 days - 1 night
    locationName: Volcán Mombacho
    description: Volcán Mombacho is a dormant volcano overlooking Lake Nicaragua, famous for its rare cloud forest ecosystem. The slopes are home to unique biodiversity and secluded eco-lodges that offer total immersion in the jungle. While the altitude provides a break from the coastal heat, the environment remains highly humid and active with wildlife, providing a raw experience of Nicaragua’s volcanic highlands.
    activities: |-
      - Stay in secluded jungle cabins located halfway up the volcano for proximity to the cloud forest.
      - Hike the established trails toward the volcano's summit.
    location:
