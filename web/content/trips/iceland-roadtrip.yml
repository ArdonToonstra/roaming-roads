  - time: Day 2
    locationName: Eyjafjöll (Skarðshlíð)
    description: "Farms at the foot of the Eyjafjöll mountains, under the Eyjafjallajökull ice cap, whose eruption grounded flights across Europe in 2010. It is a practical and scenic base for the south coast, between Seljalandsfoss and Skógafoss."
    activities: |-
      - Stay at one of the farm guesthouses along the Ring Road below the mountains.
      - Use it as a base for the day trip to Vík and the black-sand beaches.
    location:
