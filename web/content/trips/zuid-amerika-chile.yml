  - time: Day 13
    locationName: Ensenada
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      De Cochamo vallei bereiken lijkt een onmogelijke missie 🤪 De beloofde bussen komen na 1,5h wachten nog steeds niet opdagen. 4 uber chauffeurs annuleren onze rit. Een brand in een hotel in het dorp zorgt er voor dat alle busroutes wijzigen.

      Na nog eens 1,5u vinden we een busje dat de juiste richting uitgaat en ons kan afzetten halfweg, aan de Osorno vulkaan. Prima, let’s go!

      Hopelijk morgen meer geluk op de weg naar Cochamo!
    location:
      - -72.539717381
      - -41.206024187
    blockType: fullDay
  - time: Day 14
    locationName: Cochamó - Basecamp
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na nog eens een uur wachten maakt ons hart een sprongetje! We zien een bus aankomen richting Cochamo en ze hebben nog een plekje voor ons! 🚌

      We komen aan in paradijs! We hebben een heerlijke middag: eerst een beetje niksen aan de tent, daarna niksen aan de rivier (ijskoud brrr 🥶) en daarna nog meer niksen in de plaatselijke cervezeria.

      Op de camping sluiten we de dag af met een gezellig kampvuurtje.
    location:
