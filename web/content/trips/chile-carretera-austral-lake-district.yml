  - time: Day 10
    locationName: Chiloé
    description: "The largest island in Chile, reached by ferry on the way back north. Dunes, wooden churches, penguin colonies and a slower pace after Patagonia."
    activities: |-
      - Camp behind the dunes and kayak straight from the beach.
      - Take a boat trip to the penguin colonies, the island's main draw.
      - Walk the short trails in Chiloé National Park.
      - Skip the towns if time is short. The coast and the park are the reason to come.
