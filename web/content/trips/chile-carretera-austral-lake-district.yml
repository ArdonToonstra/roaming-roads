  - time: Day 5
    locationName: Hornopirén
    description: "First stop on the Ruta 7 proper, at the entrance to Hornopirén National Park. A small town with a good river and a strong local food scene."
    activities: |-
      - Go rafting. The rivers here are a good place to try it for the first time.
      - Camp at the park entrance and walk the short trails inside.
      - Climb the steep derrumbe path to a swimming spot with a view.
      - Time your visit with the local honey festival if you can.
