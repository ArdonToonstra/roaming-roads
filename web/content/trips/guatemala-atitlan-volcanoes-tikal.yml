  - time: Day 4
    locationName: Panajachel and Chichicastenango
    description: "Panajachel is the lake's transport hub and the easiest base for reaching the Sunday market at Chichicastenango, the largest in Guatemala."
    activities: |-
      - Take chicken buses to Chichicastenango for the Sunday market, a few hours of decorated streets and food stalls.
      - Haggle hard. Opening prices bear little relation to the real one.
      - Camp at the Atitlán Nature Reserve, with trails past monkeys, suspension bridges, a butterfly garden and a small beach.
      - Check hotel names carefully. Several in Panajachel are near-identical.
