      Arrive in Bishkek airport and take a direct taxi to you car rental company. Should cost around €10/1000 soms. Please rent the best available 4x4. You will need it! 

      After you are settled in the car, go for all the groceries you need along your trip: 

      - Pick up you border permit at SilkRoad Guesthouse (if you need one for your trip). Order one week in advance through a travel agency.
      - Buy campinggas at the Silkroad Guesthouse or the Red Fox campingshop (€10-15)
      - Do groceries in a large hypermarket and get out of Bishkek! You will not find a lot of grocery shop on your trip (except for Naryn).
