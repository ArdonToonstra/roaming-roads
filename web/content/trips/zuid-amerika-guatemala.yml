  - time: Day 6
    locationName: Semuc Champey
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Over exact twee weken vliegen we van Cancun/ Mexico naar huis. Onderweg naar daar hebben we nog enkele tussenstops voor ogen. De eerste is het nationaal monument Semuc Champey, bekend voor de super mooie poelen gevormd in kalksteen.

      Het is super mooi om naar te kijken vanuit het uitkijkpunt en nog heerlijker om er daarna bezweet in te springen! 💦💦

      De volgende dag vertrekken we al weer verder naar het oosten! Er moeten nog wat kilometers afgelegd worden 🚌
