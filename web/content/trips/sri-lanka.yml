    description: Visit Galle for the UNESCO  Fort, a remarkably preserved 17th-century Dutch fortress filled with colonial-era buildings, cobblestone streets, cafes and boutiques
    activities: |-
      - We visited Galle as a daytrip from Mirissa. It is also possible to stay the night here. 
      - You can wander around the fort and buy souvenirs in the local stores and eat in the restaurants. 
      - Walk on the city walls.
