  - time: Day 2
    locationName: Yoga retreat @ Eagle’s Nest
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Tijd voor wat anders! We duiken tijdens een 4 daagse yoga retreat de spirituele wereld in🧘‍♀️🧘‍♂️

      Vanuit de shala hebben we het mooiste uitzicht op het Atitlan meer. De ochtenden starten we vroeg met meditatie en yoga en in de namidagen zijn er allerlei workshops zoals breathwork, acroyoga, chakradans, aerial silks,.. teveel om uit te kiezen! ‘S avonds laten we de spieren ontspannen in de temazcal sauna (waar iedereen samen chant) en plunge pool! 💦 Tussendoor genieten we van de gezonde maaltijden, ons prachtige terras en het fantastische uitzicht.

      De laatste avond wordt er een open microfoon georganiseerd en komen er allerlei spirituele gekkies (zoals Hare Krishna aanhangers) om hun prediken, muziek en verhalen te vertellen. Het geeft een interessante inkijk in een ander soort leven 😅

      Het uitzicht en het klimaat zijn zo fantastisch dat we besluiten om nog wat langer rond het meer te blijven hangen. We vertrekken uitgerust naar het buurdorpje met de lancha! 🚤
