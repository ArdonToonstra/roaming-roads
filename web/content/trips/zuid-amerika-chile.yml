      We rijden langs flamingomeertjes, vulcaan uitkijkpunten, we zien lama’s, guanaco’s en gaan richting de 4400 meter hoogte! ⛰️

      Eens het wat afgekoeld is, durven we uit de auto te stappen en maken een wandeling door een canyon en vinden een privé hot spring badje, heerlijk! Wel met veel puffen en pauzes, aan deze hoogte moeten we nog even wennen 😅
