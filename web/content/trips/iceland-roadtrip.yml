  - time: Days 5–6
    locationName: Seyðisfjörður
    description: "An artsy village at the end of a deep fjord in the east, reached over a high mountain pass from Egilsstaðir. It has colourful wooden houses, a rainbow-painted street leading to the blue church, cafés and galleries. The ferry from Denmark docks here."
    activities: |-
      - Stay two nights to rest after the long drive from the south.
      - Walk the rainbow street to the blue church, then up along the waterfalls on the hillside.
      - Drive the Fjarðarheiði pass slowly, because fog and low cloud are common at the top.
    location:
