    locationName: Lagunas Antiplatos (SPdA)
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      San Pedro is, ondanks dat een tourist hotspot is, een super tof dorpje! De veel gelijkaardige adobe huisjes en auto luw centrum zorgen voor een goede dessert vibes. We drinken biertjes in een cool (letterlijk en figuurlijk) donker barretje, eten bij een veggie restaurantje, en duiken ons wel verdiend bedje in.

      Volgende dag staan er een aantal hooggelegen meren op de planning. We hebben een tijdslot, dus zoeken we nog een bezienswaardigheid op de weg. Ardon raadt een monument aan, met 5 op 5 sterren op Google Maps. We rijden de weg af, verder de woestijn in, om bij een hoopje stenen aan te komen! Geinige hoax 🫨. We hebben wel mooi uitzicht en zijn onze volgende kampeerplek al aan het scouten.

      We rijden naar de verschillende lagunas: Miscanti, Miñiques en Piedras Rojas. Het zijn trekpleisters voor dieren, flamingo’s en vele andere vogels. Onderweg picknicken we uitgebreid tussen de rotsen.

      Vandaag gaan we iets eerder naar ons volgend kampeerplekje om daar wat te chillen. Hiervoor moeten we wel wat improviseren voor de felle zon. ⛺️
