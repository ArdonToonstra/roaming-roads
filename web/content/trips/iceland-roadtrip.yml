title: Roadtrip through Iceland's wonders
status: published
category:
  - road_trip
  - hiking
coverImage: iceland-cover.jpg
description: "Ten days by rental car along Iceland's south coast, through the eastern fjords and across the north, and back to Reykjavík. The route takes in fresh lava fields on Reykjanes, the Golden Circle, black-sand beaches around Vík, a guided hike on Vatnajökull, the geothermal landscapes around Mývatn and whale watching from Húsavík. Late August and early September is a good window: the summer crowds are thinning, the roads are still easy, and the nights are getting dark again."
period: August–September 2026
budget:
  currency: EUR
  perPerson: true
activities: |-
  Road trip

  Waterfalls and canyons

  Volcanoes and lava caves

  Glacier hiking

  Hot springs

  Whale watching
added: "2025-12-29"
countries:
  - iceland
importantPreparations: |-
  - Book accommodation early. It fills up months ahead along the Ring Road, so fix your overnight stops first.
  - A normal car is fine for this route; you only need a 4x4 for the highland F-roads. Take gravel and windscreen insurance.
  - Gusts can rip a car door out of your hand. Park facing the wind.
  - Check vedur.is, umferdin.is and safetravel.is daily for weather, roads and warnings.
  - Use the parking areas for photos, never the road. Off-road driving is illegal and heavily fined.
  - Iceland is expensive. Shop at Bónus and Krónan and picnic, and expect parking fees at many sights.
  - Rural petrol stations are unstaffed and need a card with a PIN. Fill up whenever the tank is half empty.
  - Weather changes several times a day. Bring layers, waterproofs, hiking shoes and swimwear for the hot pools.
itinerary:
  - locationName: Fagradalsfjall volcano
    description: Fresh lava fields close to the airport.
    activities: |-
      The Reykjanes peninsula has erupted repeatedly since 2021. Fagradalsfjall's lava fields from 2021–2023 are a short drive from Keflavík airport, so they make an easy first stop after landing. Several marked trails lead to viewpoints over the young, black lava.

      - Check safetravel.is before you go: activity has moved to the Sundhnúkur craters near Grindavík, and some areas can be closed.
      - Stay on the marked paths. Fresh lava can be hollow and sharp, and gases collect in hollows.
    connectionType: route
    location:
      - -22.2494335
      - 63.8838027
    gallery:
      - media: iceland-fagradalsfjall-02.jpg
      - media: iceland-fagradalsfjall-06.jpg
      - media: iceland-fagradalsfjall-08.jpg
    blockType: waypoint
    transportation:
      arrivalMethod: flight
  - locationName: Krýsuvíkurberg cliffs
    description: Bird cliffs on the wild south coast of Reykjanes.
    activities: |-
      A long line of sea cliffs where thousands of seabirds nest in summer. A gravel track leads from the main road to the cliff edge.

      - The track is rough but passable with a normal car if you drive slowly.
      - Most of the puffins have left by late August, but the cliffs and the surf are worth it on their own.
    connectionType: route
    location:
      - -22.1421882
      - 63.8351531
    gallery:
      - media: iceland-krysuvikurberg-03.jpg
    blockType: waypoint
  - locationName: Arnarker lava cave
    description: A lava tube you can explore without a guide.
    activities: |-
      Arnarker is a lava tube near Þorlákshöfn that you can visit on your own. You climb down through the collapsed entrance into a large cave with lava formations.

      - Bring a headlamp, gloves and solid shoes. The entrance is a scramble over rocks and the floor is uneven.
      - It is cold and often icy inside, even in summer.
    connectionType: route
    location:
      - -21.4205342
      - 63.9334612
    gallery:
      - media: iceland-arnarker-02.jpg
      - media: iceland-arnarker-03.jpg
    blockType: waypoint
  - time: Day 1
    locationName: Hveragerði
    description: "A small town built on a geothermal field, with steaming vents in the gardens and greenhouses heated by the ground. It is a good first night, close to both Reykjanes and the Golden Circle."
    activities: |-
      - Hike up the Reykjadalur valley to bathe in the hot river. It is about 3–4 km each way from the parking area above town.
      - Walk the geothermal park in town.
      - Stock up on groceries before you set off on the Ring Road.
    location:
      - -21.1868303
      - 63.9975943
    gallery:
      - media: iceland-hveragerdi-08.jpg
      - media: iceland-hveragerdi-09.jpg
      - media: iceland-hveragerdi-10.jpg
      - media: iceland-hveragerdi-11.jpg
    blockType: fullDay
    transportation:
      arrivalMethod: rental_car
      departureMethod: rental_car
  - locationName: Þingvellir National Park
    description: The rift valley between two continents.
    activities: |-
      Þingvellir sits in the rift where the North American and Eurasian plates pull apart. It was also the meeting place of Iceland's parliament, the Alþingi, founded in 930. Today it is a UNESCO World Heritage site.

      - Walk through the Almannagjá gorge along the edge of the North American plate.
      - Snorkel or dive in Silfra, a fissure of glacial water with visibility of more than 100 m. Book it in advance.
    connectionType: route
    location:
      - -21.0819412
      - 64.2786082
    gallery:
      - media: iceland-thingvellir-01.jpg
      - media: iceland-thingvellir-08.jpg
    blockType: waypoint
  - locationName: Geysir & Strokkur
    description: The geyser that erupts every few minutes.
    activities: |-
      The geothermal area that gave the word "geyser" to the world. Geysir itself is mostly quiet now, but Strokkur erupts every five to ten minutes, shooting water up to around 20 m high.

      - Stand upwind, or you will get wet.
      - Free to visit. There is a paid car park across the road.
    connectionType: route
    location:
      - -20.2117565
      - 64.3127262
    gallery:
      - media: iceland-geysir-01.jpg
      - media: iceland-geysir-02.jpg
    blockType: waypoint
  - locationName: Gullfoss
    description: The great two-tiered waterfall of the Golden Circle.
    activities: |-
      The Hvítá river drops in two steps into a deep, narrow canyon. Paths lead to viewpoints above the falls and along the edge.

      - Bring a waterproof jacket for the lower path, which is close to the spray.
    connectionType: route
    location:
