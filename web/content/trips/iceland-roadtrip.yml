  - time: Day 3
    locationName: Vík
    description: "The southernmost village in Iceland, with a red-roofed church on the hill above black-sand beaches and the Mýrdalsjökull ice cap behind it. It has the only real shops and restaurants on this stretch of coast."
    activities: |-
      - Walk up to the church for the view over the village and the sea stacks.
      - Eat or shop here. Between Vík and Kirkjubæjarklaustur there is very little.
    location:
