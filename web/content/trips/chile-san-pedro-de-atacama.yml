  - time: Day 5
    locationName: Laguna Cejar and Devil's Throat
    description: "A salt lake on the edge of the Salar de Atacama where the water is dense enough to float in, paired with a canyon trail that gets dangerously hot by late morning."
    activities: |-
      - Float in Laguna Cejar early. There are showers on site, which is rarer than it sounds out here.
      - Walk the Devil's Throat canyon, but start early and carry plenty of water. The heat and dryness build fast.
      - Camp overlooking the Salar de Atacama for the sunset and the night sky.
    location:
