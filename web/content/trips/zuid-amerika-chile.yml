  - time: Day 29
    locationName: El Tatio Geyser/Valle de Cactus & Muerte (SPdA)
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Na een verfrissend bad in de hotspings, zoeken we naar onze volgende wild kampeerplek, ergens strategisch gelegen op de weg voor morgen. We worden wederom beloond met een prachtig uitzicht en onvoorstelbare stilte.

      Wekker gaat af om 5u want het schijnt dat je het derde grootste geyser veld ter wereld net voor de zonsopgang moet bekijken, wanneer ze het actiefste zijn. We slapen licht door de hoogte dus zijn zo wakker! Door de koud (-2) ‘s ochtends ontstaat er heel veel stoom en borrelend water. Het is een speciale ervaring!

      Onderweg naar het stadje San Pedro maken we nog een prachtig wandelingetje in de Valle De Cactus. Nadat we geparkeerd zijn, nodigt een tourbus ons uit om aan te schuiven bij een luxe ontbijttafel ❤️🥖🍳🥑 Exact wat we nodig hadden!

      Het is een vroege en dus lange dag. We hebben tijd om nog een wandeling te maken, nu op een plek waar nooit water te vinden is: de Valle De La Muerte. Er is een gigantische zandduin waar we geïmproviseerd een sandboard experience proberen!

      Uitgeput na deze lange dag komen we ‘s middags aan in een chique hotelletje met zwembad en gaan ‘s avonds het stadje verkennen!
