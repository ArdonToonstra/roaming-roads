  - time: Day 15
    locationName: Santiago
    description: "Worth more than the transit stop most travellers give it, but only in the right neighbourhoods. The area around the central station is grim; the rest of the centre is not."
    activities: |-
      - Zigzag through the centre on foot for the architecture. Street protests are a regular feature.
      - Pick your districts carefully and skip the station quarter.
      - Use it as the staging point for the flight north to the Atacama.
