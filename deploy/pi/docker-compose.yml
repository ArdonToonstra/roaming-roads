services:
  web:
    image: caddy:2-alpine
    container_name: roamingroads-web
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # deploy.sh ships the built site into ./site/current on every deploy.
      - ./site/current:/srv/roamingroads:ro
    # The Pi already runs a cloudflared for its other services; it reaches
    # this over the docker bridge gateway at http://172.17.0.1:8081.
    # That's the same pattern umami/homepage/wallos already use here.
    ports:
      - "8081:80"
