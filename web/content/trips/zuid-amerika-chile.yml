  - time: Day 15
    locationName: Cochamó - Valley
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      We worden met een stralend zonnetje wakker ☀️ Al het vocht dat in deze vallei wordt vastgehouden, verdampt in grote wolken rond onze tent. We pakken snel in om aan onze tweedaagse wandeltocht te beginnen.

      De eerste 12 kilometer naar de camping is wat saai, maar de bestemming zeker niet! We komen terecht in een hippe Chileense vakantie hotspot waar vriendengroepen komen klimmen, zwemmen en wandelen. In de avond ontstaan er spontane dansende mensen, andere leggen hun slaapzak buiten om naar de sterren te kijken en we ruiken af toe toe een vlaagje wiet voorbij komen.

      Onze voorziene 4 dagen hier werd ingekort naar 2 dagen (problemen met de vluchten en bussen). Dan maar 4 wandelingen op twee dagen doen.. (ja dat was een slecht idee 🤪) We nemen het tokkelbaantje naar de overkant van de rivier en wandelen naar de bekende glijbaan watervallen en naar de spiegelgladde Trinidad lagoon (klim van 1200m). De laatste middag wandelen we bekaf de 12km de vallei terug uit. We belonen onszelf met een welverdiende cerceza!

      Uit Cochamo wegkomen lijkt even moeilijk als er te geraken. Onze taxichauffeur dringt echt aan om de eerste bus om 6.15 te nemen.. we staan ‘s ochtends om 5u op en staan braaf klaar. Alleen ghost de taxichauffeur ons ineens en laat ons (letterlijk) in de koud staan 😭 Gelukkig geraken we uiteindelijk wel bij onze huurauto, waarmee we komende 3 weken een roadtrip maken over de wereldbekende Ruta 7! 🚗
    location:
