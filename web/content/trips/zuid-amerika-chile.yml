    locationName: Coyhaique
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Roadtrip 🚙 !! Als we Futaleufu uitrijden pikken we al snel drie dames uit Vina Del Mar op, die komende 8 uur met ons meerijden naar Coyhaique.

      Tijdens de hobbelende/onverharde wegen en de bergen door krijgen we wat Spaanse les en tips voor onze verdere reis.

      Onze auto is zeer populair op de camping! De volgende hitchhiker heeft haar plekje al gereserveerd: naar het startpunt van onze 4 daagse hike in Cerro Castillo 🏔️
    location:
