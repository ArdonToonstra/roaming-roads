  - time: Day 7
    locationName: Futaleufú
    description: "A whitewater town near the Argentine border, built around one of the best rafting and kayaking rivers in the world. Entirely weather dependent."
    activities: |-
      - Raft or kayak the Futaleufú river, the main reason to come.
      - Have a plan B. Cold rain can shut the water sports down for days at a time.
      - Drive the short sightseeing loops around the valley between showers.
