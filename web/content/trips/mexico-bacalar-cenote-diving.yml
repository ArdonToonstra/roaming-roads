importantPreparations: |-
  - **Cenote diving demands good buoyancy control.** Instructors assess it on the first dive and only then allow the advanced routes. These are overhead environments with real safety rules.
  - **Book dives with a shop that briefs properly.** Expect a detailed run-through of the route and the safety procedure before entering the water.
  - **Hurricane season runs June to November.** Storms turn cenote water brown and cancel dives at short notice, so keep the schedule loose.
  - **Bacalar is cheaper and quieter than the Riviera Maya coast.** It is worth more nights than most itineraries give it.
  - **Hire the dive shop's photographer** if you want images. Cameras are hard to handle in a cave.
itinerary:
  - time: Day 1
    locationName: Bacalar
    description: "A long freshwater lagoon known as the Lake of Seven Colours, with cenotes along its length and a low-key town on the shore."
    activities: |-
      - Sail the lagoon for an afternoon. A typical route takes in three cenotes and a bird island.
      - Swim from the public piers, the cheap alternative to a boat trip.
      - Eat tacos on the waterfront and watch the evening storms cross the lagoon.
