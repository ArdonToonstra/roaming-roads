  - locationName: Hljóðaklettar
    description: Twisted basalt in Vatnajökull National Park.
    activities: |-
      The "echo rocks" in the Jökulsárgljúfur canyon are the remains of volcanic plugs, with basalt columns twisted in every direction. A short loop trail winds between them.

      - Combine it with Ásbyrgi, a horseshoe-shaped canyon nearby.
    connectionType: route
