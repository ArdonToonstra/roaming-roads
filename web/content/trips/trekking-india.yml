title: Trekking in the Indian Himalayas
status: published
category:
  - hiking
  - backpacking
coverImage: GettyRF_450207051.avif
description: "Three weeks in Uttarakhand, the Himalayan state north of Delhi. The trip covers two very different treks: an attempt at the Har Ki Dun valley done the hard way, on local buses with your own tent, and a fully organised climb to the 4,600 m Pangarchula summit via Kuari Pass. Between them come hill stations, glamping above a waterfall, the meadows around Chopta and the riverside temples of Rishikesh."
