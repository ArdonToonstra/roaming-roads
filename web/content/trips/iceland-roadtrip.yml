  - locationName: Dettifoss & Selfoss
    description: The most powerful waterfall in Europe.
    activities: |-
      Dettifoss pours a huge volume of grey glacial water into the Jökulsárgljúfur canyon. Selfoss lies a short walk upstream.

      - Approach from the west side (road 862). It is paved and the closest to the falls.
      - Expect spray and wind. The paths can be slippery.
    connectionType: side_trip
    location:
      - -16.3859094
      - 65.8219303
