      departureMethod: taxi
  - time: Day 3
    locationName: San Antonio de Areco
    description: "The best-known gaucho town in the Pampas, on the Areco river about 110 km from Buenos Aires. Colonial streets, silversmith workshops and a gaucho museum make it the classic overnight stop in the countryside, and unlike its neighbours it has a direct bus connection to the capital."
    activities: |-
      - Visit the gaucho museum on the edge of town. Displays are Spanish-only, so bring a translation app or a guide if you want to follow the story.
      - Swim in the river running through the town centre — the local summer routine.
      - Stay in one of the old hospedajes in the centre; several are barely staffed and simply hand you the keys to the whole building.
      - Drink in the historic corner bars, several of which have been serving for over a century.
      - Take the direct bus on to Buenos Aires (about two hours). Routing between small Pampas towns almost always means going via the capital.
    location:
