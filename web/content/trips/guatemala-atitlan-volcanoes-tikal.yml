  - time: Day 2
    locationName: "Lake Atitlán: Eagle's Nest Retreat"
    description: "Multi-day yoga retreats on the slopes above Lake Atitlán, with a shala looking straight out over the water. A common four-day stop on the route around the lake."
    activities: |-
      - Book a four-day retreat: early morning meditation and yoga, workshops in the afternoons.
      - Work through the workshop range, which covers breathwork, acroyoga, chakra dance and aerial silks.
      - Use the temazcal sauna and plunge pool in the evening. It is a shared, fairly ceremonial affair.
      - Stay on around the lake afterwards and hop between villages by lancha.
