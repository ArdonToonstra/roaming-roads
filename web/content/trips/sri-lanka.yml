  - time: 3 days - 2 nights
    locationName: Kalpitiya
    description: "Arrive at the kitesurf paradise of Sri Lanka! "
    activities: |-
      - Once you arrive in Sri Lanka, Kalpitiya is a perfect first stop if you like to kite surf! You can arrange everything in the Margarita Village or in another kite school. 
      - It is 3 hours driving from the airport, so if you arrive late, a closer destination would be more advisable (like Galle). 
      - If you don't like to kitesurf there is plenty of other things to do here as diving, kayaking, swimming,.. 
      - This place is not as touristic as other places. This makes this the perfect spot to acclimatize!
