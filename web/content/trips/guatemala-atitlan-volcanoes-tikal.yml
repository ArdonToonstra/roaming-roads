  - time: Day 5
    locationName: Acatenango and Fuego Volcanoes
    description: "An overnight climb up Acatenango to a camp facing Fuego, one of the most active volcanoes in the world. Around 1,200 m of steep ascent, with eruptions audible and visible through the night."
    activities: |-
      - Start early from Antigua. The climb to base camp takes most of the day.
      - Expect cloud on arrival. The eruptions are usually heard well before anything is visible.
      - Consider the optional four hour extension hike toward Fuego itself for a closer view.
      - Pack warm clothes. The camp is high and drops sharply in temperature after dark.
      - Ask the operator about food handling and carry your own backup. Group-wide illness on this trek is common.
    location:
