  - time: Day 4
    locationName: Panajachel/ Chichicastenango
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Ons laatste dorpje aan het meer: Panajachel. Na een vroeg boot ritje lopen we naar ons net geboekte hotel. Althans, dat denken we. We staan voor een hotel met bijna dezelfde naam. Klein dyslectisch foutje. Dit hotel ziet er ook top uit dus doen we: bekijk-kamer-en-onderhandel-over-de-prijs-methode. 🏨

      We dumpen onze spullen en vertrekken met drie verschillende 🐓🚌 naar de grootste zondagsmarkt van Guatemala in Chichicastenango. Hier verdwalen we voor een paar uur in vrolijk aangekleede straatjes en eten we van verschillende voedselstalletjes. We kopen hier en daar wat en leren dat er hier flink onderhandeld moet worden. Zonder iets te zeggen dalen ze zelf van 300 naar 50 quetzales 🤔.

      De volgende dag trekken we naar het Atitlan Nature Reserve, waar we op de website zien dat je hier ook kan kamperen! Na meer dan twee maanden halen we eindelijk onze tent nog eens boven ⛺️ Vanaf onze tent kunnen we in het reservaat rondwandelen via de apen, hangbruggen, strandje, vlindertuin,..
