  - time: Day 8
    locationName: "Día 6: Paine Grande - Francés (Torres del Paine)"
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      We starten de etappe van 23km, die de tweede punt van de W ingaat. Terwijl dit het drukste deel van heel het circuit is, hebben we na 2u nog steeds niemand gezien.. Als we toch even de kaart checken blijkt dat we een detour door het afgebrande bos maken. 12 jaar geleden wou een tourist wc-papier wegbranden en stak daarmee voor 3 maanden een groot stuk van het park in brand 🫢

      De detour, zere voeten en de klim van 1.368 meter zorgen voor een laag moraal bij Moreels. Maar het uitzichtpunt is wederom de moeite waard!

      Onze tent staat vandaag op een fancy platform, en we trakteren onszelf op een welverdiende pizza (geen droogvoer meer voor ons bleh 😅).
    location:
      - -73.025811919
