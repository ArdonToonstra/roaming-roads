  - time: Day 25
    locationName: "Valparaiso & Viña del Mar "
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Het lijkt hier de normaalste zaak van de wereld om bij kennissen van kennissen te verblijven dus surfen we verder op de Chileense gastvrijheid. Na een belletje van Paulina hebben we een verblijfplaats bij Robinson, op de hotspot in Valparaiso en kunnen we de sleutels ophalen in een supermarktje 😄

      Na aankomst verkennen we Viña del Mar. We trekken een foto bij de bloemenklok (onder lichte dwang van Nico), we chillen op het strand, dwalen wat rond en gaan nog eens lekker uit eten. 🏖️

      Volgende dag is Valparaiso aan de beurt. Het overtreft onze verwachtingen! Een autoluw doolhof op steile heuvels met vele trappetjes. Overal kleur en muurschilderingen. 🎨 We spotten chillende zeeleeuwen, bezoeken een oude gevangenis, typische begraafplaats, de familie Moreels sluit in de avond aan om samen uit eten te gaan.

      Robinson, onze host, neemt ons vrijdagavond mee uit in de stad samen met een vriend. Ze willen filosoferen en diepe gesprekken voeren. De taalbarrières maken dat quasi onmogelijk.. maar we maken er het beste van! ❤️
