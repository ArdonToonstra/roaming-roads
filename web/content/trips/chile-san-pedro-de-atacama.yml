  - time: Day 7
    locationName: Calama
    description: "The mining city with the regional airport, where rental cars go back. Not a destination, but the necessary last stop before the Bolivian border."
    activities: |-
      - Return the car at the airport and repack for onward travel.
      - Look out for a diablada, the costumed devil dance performed in the streets.
      - Start early for the Bolivian border. The crossing itself is a long day.
