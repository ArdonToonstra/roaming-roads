      - media: iceland-solheimasandur-06.jpg
    blockType: waypoint
  - locationName: Seljavallalaug
    description: An old swimming pool built into a mountain valley.
    activities: |-
      One of Iceland's oldest swimming pools, built in 1923 against the valley wall and filled by a hot spring. The water is warm rather than hot.

      - About 20 minutes' walk from the parking area, partly through a stream bed.
      - The changing rooms are basic. Leave them as clean as you found them.
    connectionType: side_trip
    location:
