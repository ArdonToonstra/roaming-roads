  - time: Day 20
    locationName: Cerro Castillo
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Zonder al te veel onderzoek en voorbereidingen starten we aan Las Horquetas, een vrij onontdekte 4 daagse door het nationale park in Cerro Castillo.

      We durven onszelf ondertussen doorwinterde hikers te noemen en besluiten om het Duits meisje, Leya, dat met ons meelift naar het startpunt, onder onze hoede te nemen. Dit wordt haar eerste keer kamperen + meerdaagse hike 🏕️

      Tijdens de eerste dag ontmoeten we ook Barbs, die met een rugzak van 40 kg (beweert ze zelf) zelfzeker de berg oploopt. Ze komt wel elke dag pas uuuren na ons aan in het kamp.

      De campings zijn basic: geen douche, wc-put en water haal je uit de rivier verder op. De eerste nacht vriest bijna heel het kamp weg. Het koelt hier ‘s avonds af richting de 0 graden 🥶 We hebben dan ook al snel de ‘teatime’ traditie, even lekker samen opwarmen na de hikes in het kamp.

      De voorlaatste dag ontmoeten we ook nog een belg die met dezelfde organisatie als Lisa in Ghana is geweest. Toeval! We wandelen de laatste 1,5 dag samen.

      De route brengt ons langs gletsjers, laguna’s en prachtige uitzichten. Doet zeker niet onder aan Torres Del Paine. De foto’s spreken voor zich! 📷

      Na de laatste wandeldag moeten we nog 37 km terug naar de auto. Er zijn geen bussen of taxi’s dus proberen we het liften ook eens uit! Zonder veel succes.. de eerste 7 km komt er geen auto voorbij en in het eerst volgende dorp staan er 12 hitchhikers voor ons. Twee honden helpen zelfs een handje en proberen auto’s tegen te houden (zie foto). Ook Lisa die ergens zielig alleen staat, wordt niet meegenomen.. Na 4,5u vindt Lisa een park ranger die na zijn werk die richting uitgaat, jeeeuj!! 🎉 Respect voor al die lifters hier, het is geen pretje!
    location:
