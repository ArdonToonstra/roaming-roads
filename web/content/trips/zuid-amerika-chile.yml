  - time: Day 9
    locationName: "Día 7: Francés - Central (Torres del Paine)"
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Opnieuw een pittige dag met veel stijgen en dalen. We lopen een groot stuk met onze zwitserse vrienden mee en zij houden ons tempo hoog. Geen tijd om over onze pijntjes na te denken vandaag!

      Bij nader inzien hebben we vandaag niet de beste camping geboekt en slapen als enige van al onze o-trek vrienden in de camping aan de uitgang van het park. Hopelijk komen we iedereen morgen nog tegen op de weg om afscheid te nemen!

      Opnieuw een welverdiende pizza 🍕
