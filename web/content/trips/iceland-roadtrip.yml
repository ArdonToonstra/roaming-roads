      - media: iceland-hverir-03.jpg
    blockType: waypoint
  - time: Day 7
    locationName: Mývatn (Skútustaðagígar)
    description: "Lake Mývatn lies in an active volcanic area full of craters, lava formations and hot water. At Skútustaðagígar on the south shore, a short trail loops around pseudocraters, which formed when lava flowed over wet ground and the steam blasted through it."
    activities: |-
      - Walk the pseudocrater loop at Skútustaðagígar.
      - Visit the lava labyrinth at Dimmuborgir and climb the Hverfjall crater.
      - Soak at the Mývatn Nature Baths at the end of the day.
      - Bring a head net in summer: the lake's name means "midge lake".
    location:
