  - time: Day 14
    locationName: Valparaíso and Viña del Mar
    description: "Two coastal cities side by side. Viña del Mar is the beach resort, Valparaíso the far more interesting one: a largely car-free maze of steep hills, stairways and street art."
    activities: |-
      - Wander Valparaíso's hills on foot. The murals and stairways are the whole point.
      - Visit the old prison, now a cultural centre, and the hillside cemetery.
      - Spot sea lions along the working docks.
      - Cross to Viña del Mar for the beach and the flower clock.
