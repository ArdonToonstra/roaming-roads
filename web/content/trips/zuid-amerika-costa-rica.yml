    locationName: San José
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Peru, Ecuador, Brazilië,.. laten we het voor wat het is.. We moeten de rest van ons leven ook nog iets te doen hebben 😉

      We vliegen 4.900km naar het noorden en komen aan in San Jose, Costa Rica - onze transport hub naar Nicaragua. De busrit naar de stad verloopt niet van een leien dakje. We hebben wat betalingsproblemen en de buschauffeur is niet zo geduldig. Ineens komt er een engel (uit Costa Rica) uit de bus naar voor en dringt aan om onze rit te betalen. 1000 karma punten en veel dank 🙏

      Als we hier toch zijn, kunnen we maar beter een dagje langer blijven. Gelukkig is Ardon hier enkele jaren geleden al geweest en kan Lisa dus rondgidsen! Euhm, of toch niet, Ardon herinnert zich niks meer van zijn laatste bezoek 🤭 hij regelt dan maar een free walking tour om de stad samen te verkennen. Na de walking tour gaan we nog wat lokale specialiteiten proeven op de markt. Ook hier schieten de Costa Ricanen meerdere keren te hulp, wat een gastvrijheid! De sorbetera met 100 kruiden is heerlijk, echt een aanrader.

      Het is extreem duur en niet fantastisch mooi. We zijn blij dat we de volgende dag de bus richting Nicaragua nemen. Op naar het strandleven 🏖️👙🌊☀️
