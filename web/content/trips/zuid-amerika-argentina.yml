  - time: Day 7
    locationName: Laguna del Caminante
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Que te sea leve (‘I hope you don’t suffer’) is het lokale gezegde voor zij die op trektocht vertrekken. Wel van toepassing want we vetrekken vandaag op onze eerste meerdaagse hike. We proppen alles wat we nodig hebben voor één overnachting in onze twee kleine dag rukzakken. Past net!

      We wandelen van het het ene seizoen in het andere: zon, regen, wind. We pitchen onze tent op een waanzinnig mooi plekje aan Laguna Del Caminante en vallen met vermoeide benen snel in een diepe slaap.

      De tweede dag zit wederom vol verrassingen: we trotseren een sneeuwstorm terwijl we een bergpas oversteken, we zien amper de route aanwijzingen en missen hierdoor de schijnbaar coole gletsjer cave. Eenmaal over de pas kijken we neer op een prachtige regenboog in de vallei en een zonnetje dat onze kleren snel opdroogt.

      De avond gebruiken we een appartementje in Ushuaia om ons klaar te maken voor de 12 uur durende busrit richting Puntas Arenas. Op naar Chili!
