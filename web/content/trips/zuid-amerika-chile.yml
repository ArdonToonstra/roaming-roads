    activities: |-
      Voordat we naar de woestijn in San Pedro de Atacama vliegen, hebben we een korte middag om Santiago verder te verkennen. Bij de lange overstap tijdens onze terugvlucht naar NL hebben we al een stukje van het centrum gezien rond het centraal station: niet best 🤪

      We zigzaggen wat door het centrum. Zien veel mooie gebouwen en op elke hoek van de straat lijkt een protest bezig te zijn. We herzien onze mening van Santiago! Je moet de juiste buurten vinden.

      De avond besteden we aan Dune - part 2, die hier blijkbaar met ondertiteling wordt getoond in de cinema! Een goeie voorbereiding op onze reis naar de woestijn 🏜️
