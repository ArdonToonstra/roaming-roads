  - time: Day 8
    locationName: Sri Vijaya Puram (Port Blair)
    description: "The capital of the islands, renamed from Port Blair in 2024. It is the transit point for every flight and ferry, but an afternoon here is worth it for the Cellular Jail. The British built it as a colonial prison where Indian freedom fighters were held in solitary confinement far from home, and it is now a national memorial."
    activities: |-
      - Visit the Cellular Jail with a guide. The stories of the prisoners make the visit, and the displays alone tell you much less.
      - Watch the sunset from a rooftop bar or restaurant over the harbour.
      - Treat yourself to a proper dinner before the flight back to the mainland.
