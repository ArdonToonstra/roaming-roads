    locationName: Kol-Ukok & Kel’tor
    description: Secret wild camp spot at Kel'Tor lake!
    activities: |-
      Follow the regular navigation an drive all the way up the mountain. You will need a good 4x4 and even then it will take a long time. Once arrived at Kel'Tor lake you have to leave the car at the Yurts. Take your camping stuff and walk on the right side of the lake. There are a few different and quiet spots. You can arrange a diner at one of the Yurts or cook yourself. 

      If you have time left, walk to the upper lake Kol-Ukok. This is so beautiful and you will not find another soul here! It is 12,5 km up and down.
