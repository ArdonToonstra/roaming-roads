      - media: iceland-gullfoss-03.jpg
      - media: iceland-gullfoss-06.jpg
    blockType: waypoint
  - locationName: Kerið crater
    description: A volcanic crater lake with red walls.
    activities: |-
      A collapsed crater with red and black walls around a turquoise lake. A path runs around the rim and down to the water. It takes half an hour.

      - There is a small entrance fee.
    connectionType: route
    location:
