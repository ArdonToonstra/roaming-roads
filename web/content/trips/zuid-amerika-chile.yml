  - time: Day 23
    locationName: Conguillío Nationaal Park
    description: "{\"root\":{\"type\":\"root\",\"children\":[],\"format\":\"\",\"indent\":0,\"version\":1}}"
    activities: |-
      Onze roadtrip komt aan zijn einde.. Nog twee daagjes in Conguillío nationaal park en dan moeten we onze auto inleveren 🥲

      Tijdens de autotrip ernaar toe volgen we onze spaanse podcast lessen braaf verder, het begint al beter te gaan 🇪🇸

      We mogen met de auto het park in rijden (4x4 had hier wel handig geweest 🤪). Het landschap is een gigantische lava woestijn met als middelpunt: de Llaima vulkaan. Overal waar we wandelen en komen zien we de vulkaan boven torenen.

      We beklimmen de Serra Nevada met prachtig uitzicht, kijken (tevergeefs) uit naar de puma’s die hier leven, slapen midden in het park in ons tentje en kijken terug in de tijd via de duizend jaar oude aardlagen.

      Lisa haar mat gaat lek midden in de nacht (vervloekte lavastenen 🪨🔥). Gelukkig is het onze tijdelijk laatste nacht in de tent!
